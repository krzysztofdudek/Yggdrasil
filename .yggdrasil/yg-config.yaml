version: "4.0.0"
name: "Yggdrasil"

quality:
  min_artifact_length: 50
  max_direct_relations: 10
  context_budget:
    warning: 10000
    error: 20000

llm:
  provider: ollama
  model: "qwen3.5:9b"
  endpoint: "http://host.docker.internal:11434"
  temperature: 0
  consensus: 1
  max_tokens: auto
  verify_artifacts: false
