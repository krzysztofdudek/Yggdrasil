version: "6.0.0"
quality:
  max_direct_relations: 20
parallel: 10
debug: false
# This repo dogfoods the committed, team-shared record of LLM verification
# events: each LLM fill event is written to the committed, union-merged file
# .yggdrasil/yg-events.llm.jsonl (refusal rationale stripped) instead of the
# local-only sidecar. Deterministic checks never write there, so the keyless CI
# gate stays byte-stable. This opt-in never folds into any verdict hash.
events:
  committed_llm: true
reviewer:
  tiers:
    standard:
      # Canonical reviewer for this repo. The verdict hash folds only the tier
      # NAME, so you can point `standard` at your own reviewer locally via
      # .yggdrasil/yg-secrets.yaml (a deep-merge overlay over this file) without
      # invalidating any recorded baseline. (Was configured for sonnet.)
      provider: claude-code
      consensus: 1
      # Raised from 50000: this repo's canonical rules template (rules.ts) is
      # ~46 KB, leaving almost no headroom under 50000. sonnet's 200K context handles
      # 60K comfortably, and max_prompt_chars is excluded from the verdict hash, so
      # raising it invalidates no recorded baseline. Raised again to 64000: the
      # check command file (cli/commands/check) sits right at the cap, so its
      # per-node reviewer prompts (cli-command-contract, what-why-next) had no room
      # for even a one-line edit. Raised again to 68000: correctness fixes to the
      # check command file (a priority-ordered suggested-next pick, an injected
      # review clock) pushed its cli-command-contract / what-why-next prompts just
      # past 64000. Raised again to 72000: the type-covered header split and the
      # zero-classifying-types notice again pushed check.ts's what-why-next prompt
      # past the cap. This file is a recurring hot spot for this ceiling; 72K keeps
      # comfortable headroom under sonnet's 200K context for the next edit too.
      # Raised again to 96000: the reviewer prompt now numbers every subject line
      # (prompt rev 4), about six more characters per line, which took the
      # 1,300-line aspect-test command file to ~81K and advise-nominations to ~74K.
      # Still well under half of sonnet's 200K context; excluded from the hash.
      max_prompt_chars: 96000
      config:
        model: sonnet
