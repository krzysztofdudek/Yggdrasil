# yg-node.yaml — Schema for model nodes
# Every node is a directory under .yggdrasil/model/ containing this file
# plus artifact .md files.

name: <string>                    # required — display name
type: <string>                    # required — must match a type in yg-architecture.yaml
description: <string>             # optional
blackbox: false                   # optional, default false

aspects: [<aspect-id>]            # optional — own aspect extras beyond inherited

ports:                            # optional — typed ports for consumers
  <port-name>:
    description: <string>         # required
    aspects: [<aspect-id>]        # required — may be empty list

relations:                        # optional — outgoing dependencies
  - target: <node-path>           # required — path relative to model/
    type: <relation-type>         # required — calls | uses | extends | implements | emits | listens
    consumes: [<port-name>]       # required when target has ports
    failure: <string>             # optional — failure handling strategy

mapping:                          # optional — flat list of source file/directory paths
  - <string>                      # file or directory path relative to repo root
