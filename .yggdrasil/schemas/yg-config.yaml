# yg-config.yaml — Schema for project configuration

version: <string>                 # required — managed by CLI
name: <string>                    # optional — project display name

quality:                          # optional — quality thresholds
  min_artifact_length: <number>
  max_direct_relations: <number>
  context_budget:
    warning: <number>             # default 10000
    error: <number>               # default 20000

llm:                              # optional — LLM verification configuration
  provider: <string>              # ollama | openai | anthropic
  model: <string>                 # model ID per provider
  endpoint: <string>              # optional custom endpoint
  temperature: 0                  # reduces variability — keep at 0
  consensus: <number>             # positive odd integer >= 1 (default 1)
  max_tokens: auto | <number>     # auto = query provider, or explicit token limit
