# yg-aspect.yaml — Schema for cross-cutting aspects
# Each aspect is a directory under .yggdrasil/aspects/ containing this file
# plus content .md files.

name: <string>                    # required — display name
description: <string>             # optional
implies: [<aspect-id>]            # optional — recursive, acyclic
anchors:                          # required — at least one claim
  - id: <string>                  # required — identifier
    claim: <string>               # required — natural language statement verified by LLM
