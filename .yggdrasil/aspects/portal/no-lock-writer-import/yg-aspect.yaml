name: PortalNoLockWriterImport
description: >-
  Portal backend files may take from the lock-store module (io/lock-store) only
  its named readers — readLock, readTypeLock, readDetLockAspectIds, readLegacyLock,
  the lock path helpers, committedLockContentHash, the pure serializeLock, the
  error classes and the option type — by import or by member read off a namespace
  alias; any other binding from it (writeLock, writeLockSync, writeTypeLock,
  acquireApproveLock, and any writer added later) is refused. Binding a writer to
  a local then calling it is still an in-process write, so the member read, not
  just the call, is caught. They may not import the persisting fill modules
  (core/fill, core/fill-writer) at all, nor import or call a writer symbol
  (writeLock, writeLockSync, setEntry, runFill) by name from any module. The
  single write in the whole portal is the out-of-process shelled Approve; the
  non-persisting fillDetPair (core/fill-det) is allowed. AST-based.
errs: under
status: enforced
review_by: 2026-12-12
