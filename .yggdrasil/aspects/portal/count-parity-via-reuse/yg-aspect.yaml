name: PortalCountParityViaReuse
description: >-
  The portal's counts must be DERIVED by reusing the CLI's read-only functions,
  never re-implemented. The REAL guarantee is the POSITIVE manifest plus the
  count-parity integration test: every node of the engine-facade type
  (portal-engine-api) must actually CALL runCheck and computeExpectedPairs — keyed
  by the node's architecture type, not by a node id or a file basename, so renaming
  or splitting a file or a node cannot evade it — and the integration test asserts
  the emitted counts equal `yg check` on the real graph. Pipeline nodes
  (portal-pipeline) reach the engine only through that facade, so they carry no
  positive requirement of their own; a node of any other type carrying this rule is
  refused until the manifest names what it must call. The NEGATIVE arms, which apply
  to both types, are a TRIPWIRE, not the guarantee: they catch the obvious drift
  shapes — a verdict-hashing import (createHash/hashInputs) and a hand-rolled
  reducer/loop over raw lock verdicts (the `.verdicts` map directly OR a local bound
  from it: `const entries = lock.verdicts`, `const { verdicts } = lock`) — but are
  inherently heuristic and an obfuscated re-count can evade them, which is precisely
  why the positive manifest and the parity test carry the weight. AST-based, scope
  per node.
errs: under
status: enforced
