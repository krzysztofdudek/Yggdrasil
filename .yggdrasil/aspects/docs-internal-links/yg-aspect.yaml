name: DocsInternalLinks
description: >-
  Every internal link on a documentation page must resolve to an existing
  documentation page. The check reads the whole doc set at once (the aspect's
  subject is a single node that maps every doc page), builds the set of clean-URL
  keys that exist, and flags any inline markdown link whose resolved target is
  absent — a broken internal link that would 404 for a reader. A #fragment must
  also name an anchor the target page renders: a heading id as VitePress's slugify
  produces it (or an explicit {#id}), or a literal id/name attribute — a
  GitHub-style slug the site never renders lands the reader at the top of the
  page instead of the section. It under-approximates
  by design (errs: under): it resolves only what it can with certainty and skips
  external links, assets, reference-style links, and anything
  inside a code block or code span, so every violation it reports is a provably
  dead link and it has no false positives. IMPORTANT: all documentation pages must
  live in ONE node for this rule to be complete — a page in a sibling node it cannot
  see would read as a broken target — which is why the adopter docs are modeled as a
  single node.
errs: under
status: enforced
