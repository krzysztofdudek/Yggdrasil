name: EventsReaderBoundary
description: >-
  G1 import boundary for the verdict-events telemetry sidecar, guarding both ends.
  READER (io/events-reader) reads local, gitignored telemetry and MUST stay out of
  the engine: only the CLI presentation commands cli/log.ts, cli/aspects.ts, and
  cli/advise.ts may import it, and NO file under source/cli/src/core/** may import
  it at all. APPENDER (io/events-store, appendVerdictEvent) is the write path;
  because every event line carries a source discriminator ('fill'|'drill'|'diag'),
  the set of subsystems allowed to WRITE events is closed — only the sanctioned
  producers may import the appender function: src/core/fill*.ts (source:'fill'),
  cli/drill.ts (source:'drill'), and cli/aspect-test.ts (source:'diag'). Pulling the
  reader into a check / verify / render / fill path would let telemetry influence a
  verdict; an unaccounted writer would corrupt the telemetry — both are forbidden.
  AST-based and alias-proof: the reader ban flags any static import- or export-from
  whose specifier resolves to events-reader; the appender ban is binding-specific,
  firing only when a non-producer imports or re-exports appendVerdictEvent (importing
  the EVENTS_FILENAME constant or the VerdictEvent type from events-store is never a
  hit). Test code is outside the enforcement engine and is exempt. errs: under — it
  fires only on a provable static import.
errs: under
status: enforced
review_by: 2027-01-13
