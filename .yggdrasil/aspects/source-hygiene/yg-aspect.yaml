name: SourceHygiene
description: "Named bundle of the baseline source-hygiene and safety rules every source file must satisfy: POSIX-only path separators (posix-paths-source), no direct minimatch import (no-direct-minimatch), no shell-injection surface (no-shell-injection — no dynamically-built exec command and no shell: true), and prototype-safe registry lookup (prototype-safe-registry-lookup — a dynamic read of a module-const object-literal lookup table must guard against inherited Object.prototype keys). A single attach point keeps the rules bound together so they cannot silently diverge across node types. Aggregate only — it has no own reviewer and produces no own verdict; it expands to its children on every node where it is effective."
reviewer:
  type: aggregate
status: enforced
review_by: 2027-04-15
implies:
  - posix-paths-source
  - no-direct-minimatch
  - no-shell-injection
  - prototype-safe-registry-lookup
