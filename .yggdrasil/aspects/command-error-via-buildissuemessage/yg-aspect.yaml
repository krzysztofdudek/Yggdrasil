name: CommandErrorViaBuildIssueMessage
description: "Every line a CLI command writes speaks the one output grammar. A command error, notice or warning goes through the CLI output layer (fail / failAndExit for an error, notice for a note, warn for a non-fatal problem, block to render one) or buildIssueMessage — each renders the labelled what / why: / next: form — or through the loadGraphOrAbort / abortOnUnexpectedError helpers; a raw stderr.write of an error is forbidden. No string in a command file opens a line with a label of the old grammar (a capitalised Why: / Fix: / Next: / Then: / Error: / Notice: / Warning:, or Next (this group):): the grammar's labels are lowercase and come from the output layer. (A hand-rolled plural or a hand-built count is the output-through-layer rule's, over the whole shipped source tree.)"
review_by: 2026-11-29
errs: over
reviewer:
  type: deterministic
# No `when`: the architecture attaches this aspect to BOTH the `command` and
# `command-support` types, and the check.mjs glob (**/src/cli/*.ts) already scopes
# it to command-layer files. A `when: { node: { type: command } }` here previously
# filtered it back OFF on command-support — silently un-enforcing it on the exact
# node (cli/preamble) that houses the canonical buildIssueMessage-emitting helpers.
