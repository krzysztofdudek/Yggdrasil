name: CommandErrorViaBuildIssueMessage
description: "CLI command handlers must construct user-visible error messages through the CLI output layer (fail / failAndExit for a command error, notice for a non-fatal notice, block to render a diagnostic — each renders the structured what/why/next through buildIssueMessage), through buildIssueMessage directly, or route them through the loadGraphOrAbort / abortOnUnexpectedError helpers. Raw stderr.write of 'Error: ...' strings (constant text, .message concatenation) is forbidden in command files."
review_by: 2026-11-29
errs: over
reviewer:
  type: deterministic
# No `when`: the architecture attaches this aspect to BOTH the `command` and
# `command-support` types, and the check.mjs glob (**/src/cli/*.ts) already scopes
# it to command-layer files. A `when: { node: { type: command } }` here previously
# filtered it back OFF on command-support — silently un-enforcing it on the exact
# node (cli/preamble) that houses the canonical buildIssueMessage-emitting helpers.
