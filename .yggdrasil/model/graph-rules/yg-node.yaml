name: Graph Rule Scripts
type: rule-script
description: "The deterministic check.mjs implementation for every aspect this graph defines, at whatever depth its aspect id nests (a top-level id, or a grouped one such as portal/<id>), never the fake rule scripts inside drill cases. Governed like any other first-party source under this same repository's own rules, closing the gap where the rule scripts that enforce the graph were themselves outside the graph's coverage."
aspects: []
relations: []
mapping:
  # One entry per nesting depth an aspect id has (a top-level aspect, and a
  # grouped one such as portal/<id>; a deeper id needs its own entry here). A single recursive glob would also sweep in the
  # fake rule scripts that drill cases carry under their own nested .yggdrasil/,
  # and a mapping entry cannot subtract. A unit test fails the moment a rule
  # script appears that none of these entries reaches.
  - .yggdrasil/aspects/*/check.mjs
  - .yggdrasil/aspects/*/*/check.mjs
