name: Formatters
type: formatter
description: >-
  Output formatting for the graph's answers, converting structured data to text
  for a person and to versioned JSON documents for a layer above the agent.
  Ten machine forms live here, each owning its own schema constant, its
  document types and its serializer: the context package (every rule with its
  effective status, reviewer kind, cascade channel and the node/type chain it
  inherits along), the blast radius of one component (the ports it publishes
  with their consumers, its direct and indirect dependents, and the path each
  indirect one is reached through), the structure of one component (what it
  is, what it owns, what it depends on, the ports it publishes, and where it
  sits in the hierarchy), the whole verdict set of one check run (every
  expected pair with what the lock says about it, the totals, the coverage
  terms, the standing floor a measured change stands on, who judged outside the
  configured reviewer — verdicts an older lock may still hold — and the reason
  for the exit code), the rule inventory (each rule's kind, status, review date,
  drill-corpus size and reach), the rule health view as its own document (per
  rule its counts, its catch/exposure signal and the plain-words reading, with
  null for a question never asked), one drill run (the five outcome counts,
  every case with what it expected and what it got, and the corpus), a rule's own log (its entries and every change
  of its standing), the proposals `yg advise` makes with the signals behind
  them, and the waiver inventory's shape (every `yg-suppress` marker with its kind, its
  resolved range and its reason, every warning with a stable code, and the
  totals). A consumer never has to parse prose to learn what governs a file,
  who depends on a component, what a component is, or how a build stands.
  For those forms this node holds only the schema constants, the document types and the pure
  `format*Json` renderers — never a builder that turns a domain result into a
  document: a `formatter`-type node may only `uses` a plain data type and
  `calls` a utility, never reach into a facade or a core result type, so a
  builder that needs one (buildAspectsJson, buildCheckJson,
  buildSuppressionsJson) lives one layer up, in the command or core module
  that owns that input. It also words everything the fill stage says while it
  runs: the engine emits each of those things as a fill event (a header's
  counts, a pair's outcome, a periodic tally, the in-place status line with the
  width it must fit, the closing totals) and the fill-text renderer turns one
  event into the exact text a person reads, so the engine owns none of those
  sentences. It also renders the whole yg check report, the one report a
  formatter composes rather than a single document: the report's views over one
  hierarchy (the verdict line, a partial-result banner when part of the graph
  did not load, the finding blocks, standing notes, and the next: / then:
  lines last; full, --details, --aspect, --top N, --summary and --summary nodes,
  every one printing the same verdict line with the true counts and a view:
  tag), the header (the verdict and metrics line, the type-level coverage
  block, the byte-guard and baseline-noise notices, the notice naming verdicts
  an older lock holds from a judge other than the configured reviewer, and the
  emoji accessibility gate), the finding blocks (grouped by code and cause,
  capped and listed in full under --details, each with its members, the shared
  why and fix, and its fill cost in pairs and calls), and the issue grouping
  the blocks and the portal worklist share (group labels, the tier and
  priority order, an -outside twin sub-ranked after every ordinary warning, an
  unverified finding grouped by its cause). The report owns the Next contract,
  the only place the step a check points at is decided: next: is the first
  step of the first block (never a fill while a code or graph error stands),
  taken from the step the finding's emitter hands over as data before anything
  is read out of its sentence, with the node, the file and the user's own
  flags filled in, a fill stating the whole command's cost, and a sentence
  supplying only ever a graph file to change, never a source file; then: names
  the fill once the fixes are in. The same step is the yg-check/1 document's
  suggestedNext and next object, and the document also gets each finding's
  label and the report's blocks and banner. It also renders a recording run a
  gate stopped (an ABORTED verdict line keeping the `yg check:` anchor, the
  gating findings as blocks) and the log entries a cost preview says a
  recording run would stop on. Under it sit the CLI's output grammar (count
  and plural agreement, capped lists with a drill command on the overflow
  line, the block heading, the lowercase labelled fields, the verdict,
  next:, then: and note: lines, the recording run a step names and its price,
  and paint and decorated, the one door to colour, decoration only) and the
  Diagnostic model with the code registry (per issue code its label, the tier
  it sorts into and the noun its members are counted in), which the command
  layer's output module re-exports to every command, and the type-level
  coverage sentences (why an attached rule does not run on a type-covered
  file, where a type's inherited parent chain stops, an absorbed implies
  cycle) shared verbatim by yg check, yg context --file, yg owner --file and
  the portal. It also holds the check's two standing notices (type-level
  coverage switched on with no classifying type, and the attention index
  skipped because git does not ignore it), shared verbatim by the check
  report and yg init. And it words yg impact's text answer: the blast radius
  of a change to a rule, a flow or a type, what an edit to a file or a
  component costs to re-verify, and the recording run that re-verifies it,
  named and priced the way yg check names it.
