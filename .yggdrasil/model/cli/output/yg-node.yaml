name: CLI Output Layer
type: command-support
description: "The command layer's one place for how the CLI speaks: the Diagnostic model (severity, code, label, subject, summary, detail lines, why, and a fix that is always readable text and, when the remedy is a runnable command, also that command), the code registry (per issue code: the label a heading and the JSON document carry — refused, unmapped, uncovered, unverified, a -outside twin with that suffix, else the code — the tier it sorts into — graph-invalid, code and graph errors, gate prerequisites, pending — and the noun its members are counted in), and the grammar every command renders through: count and plural (a count and its noun always agree), capped lists whose overflow line always carries a drill command, the block heading `severity[label] subject`, the lowercase labelled fields (at:, why:, fix:, see:, id:) with continuation lines aligned under the value, the verdict line (the `<command>: <STATUS>` anchor external parsers key on), next:, then: and note: lines, and a fix pointer that keeps a heading-introduced list whole. Decoration (colour, the glyph before a heading or verdict) is off whenever colour is; paint is the CLI's one door to colour (no other module imports chalk). The streams: writeOut and writeErr are how every command writes to stdout and stderr (no other module calls process.stdout.write or process.stderr.write, outside three named sinks), so where output goes and what guards it is decided here. count and plural are re-exported from utils, where the engine can reach them. The error path: fail writes `error[code]: what`, a labelled why and a next: step to stderr (a leading 'Run:' dropped; the code named by the caller, else inferred — node-not-found, usage, command-error) and, when the invocation answers in JSON, the yg-error/1 document to stdout, so a failed command never leaves a machine reader with zero bytes; failAndExit does the same and exits 1; notice writes a note: block and warn a warning: block for a non-fatal problem. Exists so a fact reads the same from every command and so wording can change in one place. Whether an invocation answers in JSON is read from its own command line (--json), overridable for an in-process caller; a command whose JSON answer to a failure is its own document passes document: false so stdout still carries exactly one document. Never exports a function named then: a module exporting one is a thenable, and a dynamic import of it would call it."
relations:
  - target: cli/formatters
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/model/validation
    type: uses
mapping:
  - source/cli/src/cli/output.ts
  - source/cli/src/cli/output-diagnostic.ts
