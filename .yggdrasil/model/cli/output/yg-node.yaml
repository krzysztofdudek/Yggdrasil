name: CLI Output Layer
type: command-support
description: "The command layer's one place for where the CLI's words go, and the door through which every command reaches the grammar they are said in. The grammar itself (count and plural agreement, capped lists whose overflow line carries a drill command, the block heading `severity[label] subject`, the lowercase labelled fields at:, why:, fix:, see:, id:, the verdict line external parsers key on, next:, then: and note: lines, the recording run a step names and its price, paint as the CLI's one door to colour) and the Diagnostic model with its code registry are formatters (the output grammar and output diagnostic modules of the formatters node), so the report renderers can use them without depending on the command layer; this module re-exports the parts the commands use, so a command reaches its whole grammar through one import. It owns the streams: writeOut and writeErr are how every command writes to stdout and stderr (no other module calls process.stdout.write or process.stderr.write, outside three named sinks), installed behind a terminal guard that shows, never obeys, control sequences from repository text. And it owns the error path: fail writes `error[code]: what`, a labelled why and a next: step to stderr (a leading 'Run:' dropped; the code named by the caller, else inferred — node-not-found, aspect-not-found, usage, command-error) and, when the invocation answers in JSON, the yg-error/1 document to stdout, so a failed command never leaves a machine reader with zero bytes; failAndExit does the same and exits 1; notice writes a note: block and warn a warning: block for a non-fatal problem; nodeNotFound and aspectNotFound are the one wording of those two refusals. Whether an invocation answers in JSON is read from its own command line (--json), overridable for an in-process caller; a command whose JSON answer to a failure is its own document passes document: false so stdout still carries exactly one document. Never exports a function named then: a module exporting one is a thenable, and a dynamic import of it would call it."
relations:
  - target: cli/formatters
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/check-codes
    type: calls
  - target: cli/model/validation
    type: uses
mapping:
  - source/cli/src/cli/output.ts
