name: Progressive View
type: command-support
description: "The read-only progressive VIEW line for `yg check`: how much of a
  run's finding set the current change is accountable for, measured against the
  committed reference branch the project names in its configuration. It resolves
  the git facts (merge-base, ancestry, work-tree cleanliness, tree identity, the
  changed-file set, the work-tree top level, shallow-clone state, and whether
  any submodule pointer appears among the changed paths), hands them to the
  preflight decision table, and — only for a state that table agrees can be
  scoped — enumerates the run's expected obligations, reads the stored verdicts
  they carry, reads the committed verdict record as it stood at the reference,
  and asks the burn engine which of them the change reaches. It then splits the
  run's findings and renders one sentence.

  It is NOT a gate: no severity, no finding code, no membership in the report
  and no exit code depends on any of it, and the sentence says so. Two
  invariants shape the whole module. First, a project that named no reference is
  indistinguishable from one where this does not exist — the decision table is
  consulted before any git process starts, and every failure inside is caught
  and turned into printing nothing, because an informational line must never be
  able to fail a build. Second, the split is deliberately conservative: a
  finding is reported as outside the change only when it can be positively
  attributed to something the change did not reach, so a finding with no rule,
  component or file identity on it — or one naming an obligation this module's
  own enumeration never saw — counts as in scope. Over-counting makes the
  measurement pessimistic; under-counting would claim a real finding is none of
  the change's business, and that direction must never happen even in a view.

  The verdict record at the reference is read from the COMMITTED file only, and
  an unreadable one makes the module say nothing at all rather than report an
  empty one: 'the reference held no verdicts' and 'the record could not be read'
  are the same empty set, and reading the second as the first would silently
  switch off the check that notices a change deleting verdicts outright."
