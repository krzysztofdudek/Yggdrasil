name: Relations Core
type: relations-adapter
description: Relation-conformance engine — the live pass orchestration, symbol
  table and owner index, path resolution, the resolver, allowed-type lookup,
  the content-addressed per-file extraction cache and its on/off audit, and the
  verifier. Deterministic static dependency analysis over the graph, computed
  live on every check. Also runs the live type-relation gate for
  coverage.type_level — a new phase of the same live pass that checks
  statically-resolved import edges reaching a classified endpoint (an explicit
  node or a type-covered file) against the architecture's relation allow-list.
mapping:
  - source/cli/src/relations/allowed-types.ts
  - source/cli/src/relations/audit.ts
  - source/cli/src/relations/facts-cache.ts
  - source/cli/src/relations/feature-vector.ts
  - source/cli/src/relations/messages.ts
  - source/cli/src/relations/owner-index.ts
  - source/cli/src/relations/pass.ts
  - source/cli/src/relations/resolve-path.ts
  - source/cli/src/relations/resolver.ts
  - source/cli/src/relations/symbol-table.ts
  - source/cli/src/relations/type-gate.ts
  - source/cli/src/relations/verifier.ts
relations:
  - target: cli/relations/extractors
    type: calls
  - target: cli/ast/runtime
    type: calls
  - target: cli/language-registry
    type: calls
  - target: cli/core/pair-hash
    type: calls
  - target: cli/io/atomic-write
    type: calls
    consumes: [write-atomic]
  - target: cli/io/stores
    type: calls
  - target: cli/model/lock
    type: uses
  - target: cli/utils
    type: calls
  - target: cli/core/allowed-relation-types
    type: calls
