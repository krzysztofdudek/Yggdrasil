name: Group Issues
type: command-support
description: "Command-layer helper that collapses a flat CheckIssue list into grouped IssueGroup records, used by the check report's block builder and by the portal worklist. Houses FULL_WHAT_CODES, getIssueLabel (the code registry's label for a finding — refused, unmapped, uncovered, unverified, a -outside twin's label with that suffix, else the code), issueTierRank and issuePriorityRank. An unverified finding groups by its cause, which decides its fix. Groups sort by tier first (the graph did not load, code and graph errors, gate prerequisites, pending) and by the fixed priority within it; a -outside twin sub-ranks after every ordinary warning, so inherited debt never buries a genuine warning. Every -outside twin code set (CODE_ONLY_GROUP_CODES, FULL_WHAT_CODES, COVERAGE_GROUP_EXCLUDED_CODES) is derived from SCOPED_CODES rather than hand-listed."
mapping:
  - source/cli/src/cli/group-issues.ts
relations:
  - target: cli/output
    type: calls
  - target: cli/core/check-codes
    type: calls
  - target: cli/core/check
    type: calls
