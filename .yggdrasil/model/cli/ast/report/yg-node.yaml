name: AST Report
type: ast-adapter
description: AST report types and public API surface — types, report aggregator, and the @chrisdudek/yg/ast index barrel (whose walk and closest come from @chrisdudek/runes/ast).
mapping:
  - source/cli/src/ast/file-path.ts
  - source/cli/src/ast/find-comments.ts
  - source/cli/src/ast/index.ts
  - source/cli/src/ast/report.ts
  - source/cli/src/ast/types.ts
relations:
  - target: cli/language-registry
    type: calls
  - target: cli/utils
    type: calls
