name: Structure
type: structure-adapter
description: "Structure-aspect runtime — context layer (types, ctx factories for
  fs, graph, parsers, the allowed-reads collector) and execution layer
  (orchestrates check.mjs loading, ctx construction, and result collection
  including result-bearing observations). It also holds the parsing side of
  yg-suppress: the honoring path's resolved ranges, and the comment-aware scan
  of one file's markers the engine's suppression inventory asks for, so both
  read markers the same way."
mapping:
  - source/cli/src/structure/index.ts
  - source/cli/src/structure/expand-mapping-sync.ts
  - source/cli/src/structure/allowed-reads.ts
  - source/cli/src/structure/types.ts
  - source/cli/src/structure/ctx-fs.ts
  - source/cli/src/structure/ctx-graph.ts
  - source/cli/src/structure/ctx-parsers.ts
  - source/cli/src/structure/runner.ts
  - source/cli/src/structure/observations.ts
  - source/cli/src/structure/hook-loader.ts
  - source/cli/src/structure/suppress-ranges.ts
  - source/cli/src/structure/suppress-markers.ts
  - source/cli/src/structure/det-worker-core.ts
  - source/cli/src/structure/det-worker.ts
  - source/cli/src/structure/det-worker-pool.ts
relations:
  - target: cli/ast/report
    type: calls
  - target: cli/ast/runtime
    type: calls
  - target: cli/language-registry
    type: calls
  - target: cli/core/pair-hash
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/core/allowed-relation-types
    type: calls
  - target: cli/model/graph
    type: uses
  - target: cli/model/llm-contract
    type: uses
  - target: cli/model/owner-index
    type: uses
  - target: cli/model/validation
    type: uses
