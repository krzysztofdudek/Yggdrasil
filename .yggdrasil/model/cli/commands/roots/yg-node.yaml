name: Roots Commands
type: command
description: "The two roots convention-mining commands R1-R3 ships: `yg roots
  index` (config-only load — findYggRoot + parseConfig, never the graph;
  scaffolds a `roots:` block with defaults on a repo that has none, per the
  design authority, then composes the roots engine + roots store to mine and
  persist the committed model) and `yg roots status` (reads the committed
  model and reports field/fact counts and dormancy honestly; always exits 0 —
  a read surface, never a CI gate, in this increment)."
