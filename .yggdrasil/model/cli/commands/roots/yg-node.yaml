    type: calls
  - target: cli/formatters
    type: calls
  - target: cli/preamble
    type: calls
  - target: cli/model/graph
    type: uses
  - target: cli/tests/unit/cli
    type: uses
mapping:
  - source/cli/src/cli/roots.ts
