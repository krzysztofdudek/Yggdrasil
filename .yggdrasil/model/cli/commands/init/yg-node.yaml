name: InitCommand
type: command
description: Bootstraps Yggdrasil graph structure in a project or refreshes
  the universal agent rules (AGENTS.md digest + CLAUDE.md import +
  .clinerules) via yg init. Reviewer setup is optional — --no-reviewer (and
  the wizard's "None for now") bootstraps keyless, and the same keyless path
  runs when there is no TTY to prompt in. After refreshing the rules it also
  predicts, through the coverage engine's own primitives, whether the project's
  coverage settings will now report the root files it maintains as unmapped
  errors, and prints the exclude stanza — never editing the config itself.
  --platform is accepted only for backward compatibility — it prints a
  deprecation notice and is otherwise ignored, since rules now install
  identically for every agent. A fresh bootstrap turns coverage.type_level on
  by default and, since the fresh architecture template starts with no
  classifying types, prints the same zero-classifying-types notice yg check
  shows for that state.
aspects:
  - reviewer-secrets-not-from-flags
relations:
  - target: cli/templates
    type: calls
  - target: cli/core/check-coverage-tiers
    type: calls
  - target: cli/core/check-codes
    type: calls
  - target: cli/io/parsers/config
    type: calls
  - target: cli/tests/unit/cli
    type: uses
  - target: cli/core/loader
    type: calls
  - target: cli/core/migrations
    type: calls
  - target: cli/core/migrator
    type: calls
  - target: cli/core/migrator-runner
    type: calls
  - target: cli/cli-version
    type: calls
  - target: cli/formatters
    type: calls
  - target: cli/init-reviewer-setup
    type: calls
  - target: cli/init-scaffold
    type: calls
  - target: cli/preamble
    type: calls
  - target: cli/templates-platform
    type: calls
  - target: cli/utils
    type: calls
mapping:
  - source/cli/src/cli/init.ts
