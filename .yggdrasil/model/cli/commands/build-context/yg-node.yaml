name: BuildContextCommand
type: command
description: Assembles and outputs a context package for a node via yg
  build-context --node or --file. For --file on a file with no owning
  component but a matched architecture type, classifies ONLY that one file
  (never the whole-repo classification map) and renders the typed view —
  matched type, chain termination, applied/dropped rules, the derived-
  relations note, and the graduation next-step — replacing the not-covered
  error.
aspects:
  - what-why-next
relations:
  - target: cli/core/loader
    type: calls
  - target: cli/core/context
    type: calls
  - target: cli/core/validator
    type: calls
  - target: cli/core/check
    type: calls
  - target: cli/language-registry
    type: calls
  - target: cli/formatters
    type: calls

  - target: cli/utils
    type: calls
  - target: cli/tests/unit/cli
    type: uses
  - target: cli/commands/owner
    type: calls
  - target: cli/core/log
    type: calls
  - target: cli/core/pairs
    type: calls
  - target: cli/core/type-coverage
    type: calls
  - target: cli/io/lock-store
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/io/file-content-cache
    type: calls
  - target: cli/preamble
    type: calls
  - target: cli/core/check-coverage-tiers
    type: calls
  - target: cli/core/type-visibility
    type: calls
mapping:
  - source/cli/src/cli/build-context.ts
