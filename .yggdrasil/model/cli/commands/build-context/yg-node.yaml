name: BuildContextCommand
type: command
description: Assembles and outputs a context package for a node via yg
  build-context --node or --file. For --file on a file with no owning
  component but a matched architecture type, classifies ONLY that one file
  (never the whole-repo classification map) and renders the typed view —
  matched type, chain termination, applied/dropped rules (each applied rule
  tagged with its real enforced/advisory status, and a plain statement when
  literally nothing applies), the derived-relations note, and the graduation
  next-step — replacing the not-covered error. Before rendering that typed
  view, runs the type's cascade once more directly (computeTypeAspectCascade)
  to check for an absorbed aspect implies cycle — when one is present, it
  reports plainly that the type's rules could not be worked out and names the
  cycle, instead of rendering the file as satisfying coverage with zero
  enforcement, which would be false since the rules were never resolved, not
  resolved and absent.
aspects:
  - what-why-next
relations:
  - target: cli/core/loader
    type: calls
  - target: cli/core/context
    type: calls
  - target: cli/core/validator
    type: calls
  - target: cli/core/check
    type: calls
  - target: cli/language-registry
    type: calls
  - target: cli/formatters
    type: calls

  - target: cli/utils
    type: calls
  - target: cli/tests/unit/cli
    type: uses
  - target: cli/commands/owner
    type: calls
  - target: cli/core/log
    type: calls
  - target: cli/core/pairs
    type: calls
  - target: cli/core/type-coverage
    type: calls
  - target: cli/core/type-effective
    type: calls
  - target: cli/io/lock-store
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/io/file-content-cache
    type: calls
  - target: cli/preamble
    type: calls
  - target: cli/core/check-coverage-tiers
    type: calls
  - target: cli/core/type-visibility
    type: calls
mapping:
  - source/cli/src/cli/build-context.ts
