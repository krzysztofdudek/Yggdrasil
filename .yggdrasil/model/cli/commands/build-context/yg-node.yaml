name: BuildContextCommand
type: command
description: "Assembles and outputs a context package for a node via yg
  build-context --node or --file. For --file on a file with no owning
  component but a matched architecture type, classifies ONLY that one file
  (never the whole-repo classification map) for the applied/dropped rule set
  itself, and renders the typed view — matched type, chain termination,
  applied/dropped rules (each applied rule tagged with its real
  enforced/advisory status, and a plain statement when literally nothing
  applies), the derived-relations note, and the graduation next-step —
  replacing the not-covered error. A `relations:` atom on one of this file's
  attached rules is answered from a real, statically-resolved import: this
  DOES pay for classifying the whole repo once per invocation — the only way
  to recognize an import into some OTHER type-covered file — and runs the
  same relation pass yg check runs, so the rule set rendered here always
  matches what yg check enforces, never the conservative always-false a
  caller with no edge index falls back to. Before rendering that typed
  view, runs the type's cascade once more directly (computeTypeAspectCascade)
  to check for an absorbed aspect implies cycle — when one is present, it
  reports plainly that the type's rules could not be worked out and names the
  cycle, instead of rendering the file as satisfying coverage with zero
  enforcement, which would be false since the rules were never resolved, not
  resolved and absent. Each applied rule's status tag also re-verifies that
  rule against the lock with the SAME per-pair check yg check itself
  performs (verify-lock.ts's verifyPairs, scoped to this file's own already-
  computed pairs, never a second whole-project pass) and marks ', unverified'
  when the lock does NOT currently hold a valid verdict for it — a pair it
  has never seen at all, or one whose recorded verdict has gone stale since
  a source edit, both counted the same way yg check's own qualified
  'unverified' wording counts them for the identical pair. '[enforced]'
  names architecture-level status, never a recorded verdict, so the two are
  never conflated. --file also accepts --brief, a compact two-line-per-rule
  view capped at 30 lines: owner line, up to 8 rules (each rendered as two
  lines: status, id and first sentence, then its read path or draft notice,
  with an overflow pointer past the cap), and up to a few 'next:' trail
  pointers — starting with the owner's log read and its parent node's
  context, when they exist — instead of the full package's per-rule read
  paths and back-pointer prose. --brief is rejected with --node: the
  component view has no per-file rule list to compress. --file also accepts
  --aspect <id>, which wins over --brief: expands exactly one rule from this
  file's own effective set in full — the untruncated description, its status
  tag, and every read path — instead of the compact per-rule summary or the
  full package. An id not among this file's own effective rules is a user
  error (what/why/next), not routed through the generic crash handler.
  --aspect is rejected with --node by a parallel guard to --brief's: a
  component's rules are listed by yg context --node itself. The compact
  view's own trail pointers include, once the file has at least one
  effective rule, a next: pointer offering --aspect on that rule's id. The
  compact view also prices an edit: an arm-preview line counting how many
  pairs editing this file would invalidate, split into free (deterministic)
  and reviewer (llm) pairs, omitted when the count is zero and suppressed
  entirely when any subject file the count depends on could not be read (so
  the line is never printed understated). Computed from the same expected-
  pair enumeration yg check itself fills, and, for a file enforced by its
  type alone, from the SAME typed-edge index already computed for the rule
  list above it, so the count and the 'Must satisfy:' list can never
  disagree about a relation-gated rule. For a node-owned file, the compact
  view also carries the owner's log-gate state ('Log entry required before
  approve: yes|no (fresh entry present: yes|no)') and the flows it
  participates in ('Flows: <name> · <name>'), derived by the same log-gate
  sequence and flow lookup the full node view already uses, so neither can
  disagree with what yg context --node reports for the same component. Both
  lines are omitted rather than printed as a zero-information default: the
  log-gate line when the owner's type does not require one or its source
  fingerprint cannot be read, the flows line when the owner participates in
  no flow. A type-covered file has no owning component, so neither line
  applies to it. The default (no new flag) output is
  unchanged byte for byte, pinned against a committed baseline capture.
  When the project names a progressive-mode reference, both the compact and
  full views also mark this file's rules with the same measurement yg check
  gates on: each judged rule is suffixed '(yours)' when the current change is
  accountable for it or '(inherited)' when it is not — a draft rule carries
  no suffix, since nothing judges it — and the compact view additionally
  carries a scope header ('your change so far: N file(s); this file is
  in/not in it'). Reaches the change-scope resolver and the
  burn-set key helper for this rather than re-deriving either, so the
  marking can never disagree with what yg check itself would gate. Honest
  about the two cases it cannot measure: a project that names no reference
  gets no header and no suffixes at all (silent opt-out, byte-identical to
  before this measurement existed), and a project whose change could not be
  measured against its named reference gets neither header nor suffixes
  but a what/why/next notice on stderr explaining why, leaving stdout's
  <= 30-line budget untouched."
aspects:
  - what-why-next
max_direct_relations:
  limit: 23
  reason: >-
    Reviewed and accepted at exactly this count. Composition is this command's
    entire purpose: it assembles the complete context package a reader needs
    for a node, or for a file governed by its architecture type alone, so it
    necessarily reaches every source of facts that package contains — the
    loader and validator, the checker and its coverage tiers, expected pairs,
    type classification, effective rules and their visibility, the lock and
    its verifier, the log gate, the formatters, and the import-resolution pass
    that answers a dependency-gated rule. Each was checked individually and is
    real; one records the test suite covering this command, the convention
    every other command node here follows. A high count is a description of
    the work rather than a symptom, and splitting the orchestration would
    scatter the single place that must stay consistent with what yg check
    enforces without reducing any actual coupling. Raised from 21 to 23 for
    progressive-mode scope marking: the context view now answers what a
    change is accountable for using the same measurement yg check gates on,
    which means reaching the scope resolver (cli/progressive-scope-resolve)
    and the burn-set key helper (cli/core/progressive-scope) rather than
    re-deriving either.
