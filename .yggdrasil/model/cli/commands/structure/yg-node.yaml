name: StructureCommand
type: command
description: >-
  Registers `yg structure` — a read-only structural dashboard over the graph. It
  loads the graph, obtains the statically-detected cross-node dependency edges
  through the read-only portal engine-api facade (the command layer may not reach
  the relations layer directly), unions them with the declared structural
  relations, and renders three sections computed by the pure metrics core
  (core/graph-metrics): dependency tunnels, per-depth module groups, and change
  reach. At coverage.type_level on, the universe additionally widens with every
  type-covered file (via the same facade's live type-relation gate edges,
  translated into the node-id space) so a dependency reaching into or out of a
  type-covered file is not invisible to the dashboard; a malformed `when:`
  predicate degrades this widening to the node-only view rather than crashing
  the command. The tunnels ranking measures a type-covered file at a fixed,
  shallow depth (core/graph-metrics's widenedTunnelMetrics) rather than the
  file's own on-disk directory nesting, so a deeply-nested file can never
  crowd a genuine cross-module tunnel out of the ranked list purely because
  of where it happens to sit on disk — the portal's Dependency-structure
  panel reuses the identical ranking function. Never reads or writes the
  lock and never calls a reviewer — it exits 0 whenever the graph loads, so
  it never gates.
aspects: []
relations:
  - target: cli/preamble
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/core/graph
    type: calls
  - target: cli/portal/engine-api
    type: calls
  - target: cli/tests/unit/cli
    type: uses
  - target: cli/core/type-coverage
    type: calls
  - target: cli/core/check
    type: calls
  - target: cli/io/file-content-cache
    type: calls
mapping:
  - source/cli/src/cli/structure.ts
