name: AspectTestCommand
type: command
description: "Runs an aspect against a node or ad-hoc files WITHOUT touching the
  lock — a diagnostic. Deterministic mode exercises a check.mjs via the
  structure runner (--node) or AST runner (--files), with --check-determinism
  for output stability. LLM mode (--aspect <llm-aspect> --node <path>) builds
  the per-scope pair prompts and runs the reviewer, printing verdicts; --dry-run
  prints the assembled prompt(s) and makes no calls. Every diagnostic result
  ends with the footer noting the lock is unchanged and yg check still reports
  the stored verdict."
aspects:
  - provider-redaction-cascade
max_direct_relations:
  limit: 24
  reason: >-
    Raised from the project default of 20 to 21 (three dependencies the
    LLM-mode pair lookup needed to thread real type-coverage classification
    into computeExpectedPairs: cli/core/check, cli/core/type-coverage,
    cli/io/file-content-cache — see their own history), then to 24 for the
    `--file <path>` addressing mode itself (a file enforced by its
    architecture type alone, no owning component): cli/relations/core
    (buildOwnerIndex, to resolve --file's ownership check the same way
    cli/commands/owner does), cli/commands/owner (findOwner, so --file and
    `yg owner` name the identical node/no-owner answer for the same path),
    and cli/core/check-coverage-tiers (isExcludedByCoverage, so a --file
    target under coverage.excluded is refused for the same reason `yg owner`
    and `yg impact --file` already give).
relations:
  - target: cli/ast/runtime
    type: calls
  - target: cli/structure
    type: calls
  - target: cli/core/loader
    type: calls
  - target: cli/core/pairs
    type: calls
  - target: cli/core/pair-inputs
    type: calls
  - target: cli/core/check
    type: calls
  - target: cli/core/type-coverage
    type: calls
  - target: cli/core/reviewer-tiers
    type: calls
  - target: cli/llm/shared
    type: calls
  - target: cli/llm/registry
    type: calls
  - target: cli/io/parsers/config
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/io/file-content-cache
    type: calls
  - target: cli/tests/unit/cli
    type: uses
  - target: cli/exit-after-flush
    type: calls
  - target: cli/formatters
    type: calls
  - target: cli/model/graph
    type: uses
  - target: cli/preamble
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/core/companion-resolve
    type: calls
  - target: cli/core/graph
    type: calls
  - target: cli/relations/core
    type: calls
  - target: cli/commands/owner
    type: calls
  - target: cli/core/check-coverage-tiers
    type: calls
mapping:
  - source/cli/src/cli/aspect-test.ts
