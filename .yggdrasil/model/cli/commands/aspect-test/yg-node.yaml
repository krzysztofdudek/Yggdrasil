name: AspectTestCommand
type: command
description: "Runs an aspect against a node or ad-hoc files WITHOUT touching the
  lock — a diagnostic. Deterministic mode exercises a check.mjs via the
  structure runner (--node) or AST runner (--files), with --check-determinism
  for output stability. LLM mode (--aspect <llm-aspect> --node <path>) builds
  the per-scope pair prompts and runs the reviewer, printing verdicts; --dry-run
  prints the assembled prompt(s) and makes no calls. Every diagnostic result
  ends with the footer noting the lock is unchanged and yg check still reports
  the stored verdict."
aspects:
  - provider-redaction-cascade
max_direct_relations:
  limit: 21
  reason: >-
    Restored from 24 back to the pre-existing 21 (originally: raised from the
    project default of 20 to 21 for three dependencies the LLM-mode pair
    lookup needed to thread real type-coverage classification into
    computeExpectedPairs: cli/core/check, cli/core/type-coverage,
    cli/io/file-content-cache). The later raise to 24, for the `--file <path>`
    addressing mode's three extra dependencies (cli/relations/core,
    cli/commands/owner, cli/core/check-coverage-tiers), is undone here by
    extraction rather than a wider ceiling: --file's target classification
    (coverage-exclusion, single-type-classification, the nodeless
    type-coverage lookup, and the nodeless architecture-reach computation
    shared with the companion-diagnostic path) now lives in
    cli/core/aspect-test-file-target, its own engine node — which took two
    further pre-existing dependencies with it (cli/core/check,
    cli/core/type-coverage; cli/io/file-content-cache moved too but that one
    was only ever needed for the same classification work). --file's
    existence and ownership checks stay here (cli/commands/owner is still
    real: findOwner's single canonical source, owner.ts, is a `command`-typed
    file an `engine` node cannot legally call). Real usage today is 20, one
    under this ceiling — 21 is kept rather than tightened further so a small,
    genuine future addition here does not immediately require another graph
    edit.
relations:
  - target: cli/ast/runtime
    type: calls
  - target: cli/structure
    type: calls
  - target: cli/core/loader
    type: calls
  - target: cli/core/pairs
    type: calls
  - target: cli/core/pair-inputs
    type: calls
  - target: cli/core/reviewer-tiers
    type: calls
  - target: cli/llm/shared
    type: calls
  - target: cli/llm/registry
    type: calls
  - target: cli/io/parsers/config
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/tests/unit/cli
    type: uses
  - target: cli/exit-after-flush
    type: calls
  - target: cli/formatters
    type: calls
  - target: cli/model/graph
    type: uses
  - target: cli/preamble
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/core/companion-resolve
    type: calls
  - target: cli/core/graph
    type: calls
  - target: cli/commands/owner
    type: calls
  - target: cli/core/aspect-test-file-target
    type: calls
mapping:
  - source/cli/src/cli/aspect-test.ts
