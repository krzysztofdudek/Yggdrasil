name: TreeCommand
type: library
description: "Prints graph hierarchy as an indented tree with metadata via yg tree"
aspects:
  - aspect: deterministic
    anchors:
      pure-function:
        regex: "export (function|const|async function)"
  - aspect: cli-command-contract
    anchors:
      stdout-write:
        regex: "process\\.stdout\\.write"
      error-handler:
        regex: "process\\.stderr\\.write"
      exit-code:
        regex: "process\\.exit"

relations:
  - target: cli/core/loader
    type: uses
    consumes: [loadGraph]
  - target: cli/model
    type: uses
    consumes: [GraphNode]

mapping:
  - paths:
    - source/cli/src/cli/tree.ts
