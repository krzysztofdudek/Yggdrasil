name: AspectsCommand
type: command
description: >-
  Lists all aspects with usage statistics in human-readable format via yg
  aspects. Usage also counts files enforced by an architecture type alone (no
  owning component), classified once per invocation, so a rule live only through
  type coverage is never reported as unused. It also carries the two commands a
  rule's own history is written and read through — the counterparts of what a
  component has had all along — so the reason a rule exists, and every change of
  its standing, live with the rule instead of being scattered across the
  components it happens to reach. Recording a change of standing is a RECORD, not
  the change: the rule's own file stays the user's to edit, so the command
  refuses to record a standing the file does not actually carry.
aspects: []
relations:
  - target: cli/core/loader
    type: calls
  - target: cli/core/log
    type: calls
  - target: cli/core/context
    type: calls
  - target: cli/tests/unit/cli
    type: uses
  - target: cli/core/graph
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/preamble
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/io/lock-store
    type: calls
  - target: cli/core/verify-lock
    type: calls
  - target: cli/core/aspect-health-signals
    type: calls
  - target: cli/formatters
    type: calls
  - target: cli/core/drill
    type: calls
  - target: cli/io/incident-ledger
    type: calls
  - target: cli/portal/engine-api
    type: calls
  - target: cli/core/type-effective
    type: calls
  - target: cli/core/check
    type: calls
  - target: cli/core/type-coverage
    type: calls
  - target: cli/io/file-content-cache
    type: calls
mapping:
  - source/cli/src/cli/aspects-log.ts
  - source/cli/src/cli/aspects.ts
