name: AspectsCommand
type: command
description: >-
  Lists all aspects with usage statistics in human-readable format via yg
  aspects. Usage also counts files enforced by an architecture type alone (no
  owning component), classified once per invocation, so a rule live only through
  type coverage is never reported as unused. It also carries the two commands a
  rule's own history is written and read through — the counterparts of what a
  component has had all along — so the reason a rule exists, and every change of
  its standing, live with the rule instead of being scattered across the
  components it happens to reach. Recording a change of standing is a RECORD, not
  the change: the rule's own file stays the user's to edit, so the command
  refuses to record a standing the file does not actually carry. The machine
  inventory can also name the units behind those usage counts on request
  (--json --reach): it enumerates them from the same expected-pair computation
  the gate runs, never from a walk of its own, so the two can never disagree
  about what a rule reaches — and it enumerates draft rules too, which the gate
  omits because it does not judge them, so a rule that reaches nothing stays
  distinguishable from one not yet judging what it reaches. The health
  projection answers in its own versioned document on request (--health
  --json), never folded into the inventory's, so one schema name never means
  two things.
aspects: []
max_direct_relations:
  limit: 21
  reason: >-
    Reviewed at exactly this count. This node owns two commands — the rule
    inventory with its health projection, and each rule's own history — and the
    inventory reads every fact a rule has: its reach through the graph and the
    type tier, the lock and its verifier, the drill corpus, the incident ledger,
    the suppression scan and the rule's log. The twenty-first edge is the CLI
    output layer, through which both commands now report their errors like every
    other command.
