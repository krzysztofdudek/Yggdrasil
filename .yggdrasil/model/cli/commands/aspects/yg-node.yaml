name: AspectsCommand
type: command
description: >-
  Lists all aspects with usage statistics in human-readable format via yg
  aspects. Usage also counts files enforced by an architecture type alone (no
  owning component), classified once per invocation, so a rule live only through
  type coverage is never reported as unused. A rule's own history is no longer
  written or read here: it is one of the logs the log command names, so every
  log has one command; the inventory still reads that history for each rule's
  last entry. The machine
  inventory can also name the units behind those usage counts on request
  (--json --reach): it enumerates them from the same expected-pair computation
  the gate runs, never from a walk of its own, so the two can never disagree
  about what a rule reaches — and it enumerates draft rules too, which the gate
  omits because it does not judge them, so a rule that reaches nothing stays
  distinguishable from one not yet judging what it reaches. The health
  projection answers in its own versioned document on request (--health
  --json), never folded into the inventory's, so one schema name never means
  two things.
aspects: []
