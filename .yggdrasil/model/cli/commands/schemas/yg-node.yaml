name: SchemasCommand
type: command
description: Implements `yg schemas list` and `yg schemas read <name>` —
  read-only access to the schema of every YAML file format the CLI reads. The
  list, each summary and each field table come from the file-format schema
  objects the parsers enforce; the annotated example above a field table is the
  format's schema document embedded in the CLI binary.
aspects: []
relations:
  - target: cli/output
    type: calls
  - target: cli/file-formats
    type: calls
  - target: cli/schemas
    type: calls
  - target: cli/preamble
    type: calls
  - target: cli/tests/unit/cli
    type: uses
mapping:
  - source/cli/src/cli/schemas.ts
