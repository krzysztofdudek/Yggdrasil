name: CheckCommand
type: command
description: >-
  Unified graph gate CLI command — combines drift, validation, coverage, and
  completeness into a single yg check entry point with grouped output and exit
  code. A --json flag emits the same run as one versioned machine document
  instead of that report, for a layer above the agent — a wave close computing a
  quality index, a dashboard, a build step deciding what to schedule — that must
  never learn a fact by parsing prose written to be read. It composes with the
  fill flags and leaves every exit code exactly what it was; under it stdout
  carries the document alone, so even the cost preview a dry run prints joins
  the progress on stderr. It is REFUSED together with the four text-view
  selectors: those narrow a wall of prose, the document always carries the whole
  run, and a document trimmed to a few findings would read as a smaller problem
  rather than a smaller rendering.
aspects:
  - runcheck-injected-input-parity
relations:
  - target: cli/det-concurrency
    type: calls
  - target: cli/io/atomic-write
    type: calls
    consumes:
      - write-atomic
  - target: cli/core/loader
    type: calls
  - target: cli/core/check
    type: calls
  - target: cli/tests/unit/cli
    type: uses
  - target: cli/core/fill
    type: calls
  - target: cli/exit-after-flush
    type: calls
  - target: cli/formatters
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/preamble
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/rules-artifacts
    type: calls
  - target: cli/check-render-header
    type: calls
  - target: cli/check-render-groups
    type: calls
  - target: cli/check-render-views
    type: calls
  - target: cli/progressive-scope-resolve
    type: calls
mapping:
  - source/cli/src/cli/check.ts
