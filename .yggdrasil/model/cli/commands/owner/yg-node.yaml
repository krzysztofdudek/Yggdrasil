name: OwnerCommand
type: command
description: "Resolves a file path to its owning graph node via yg owner. For
  an unmapped file with a matched architecture type, classifies ONLY that one
  file (never the whole-repo classification map) and answers with the type
  instead of 'no graph coverage' — the graph directory itself and a
  coverage.excluded root both stay exempt. Before computing enforcement,
  checks whether the matched type's aspect cascade hit an implies cycle; if
  so it reports the cycle by name and stops, instead of computing this one
  file's expected pairs (never the whole-repo enumeration) and saying nothing
  enforces — that claim would be false when the cascade never actually ran.
  With no cycle, it decides whether the matched type actually enforces
  anything here from the real computed pairs, saying so only when at least
  one real pair exists; with zero it says that plainly instead, never
  claiming enforcement that is not there. When it does say a rule is
  enforced, it also re-verifies each of those rules against the lock with
  the SAME per-pair check yg check itself performs (verify-lock.ts's
  verifyPairs, scoped to just this file's own handful of pairs — cheap on
  top of the whole-project pair walk above, never a second one) and names
  how many currently have no valid recorded verdict — a pair the lock has
  never seen at all, or one whose recorded verdict has gone stale since a
  source edit, both counted the same way yg check's qualified 'unverified'
  wording already counts them for the identical pair, so 'enforced by
  architecture' is never read as 'already verified'."
aspects:
  - posix-paths-output
relations:
  - target: cli/core/loader
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/relations/core
    type: calls
  - target: cli/model/graph
    type: uses
  - target: cli/tests/unit/cli
    type: uses
  - target: cli/formatters
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/preamble
    type: calls
  - target: cli/core/type-coverage
    type: calls
  - target: cli/io/file-content-cache
    type: calls
  - target: cli/core/check-coverage-tiers
    type: calls
  - target: cli/core/pairs
    type: calls
  - target: cli/core/type-effective
    type: calls
  - target: cli/core/type-visibility
    type: calls
  - target: cli/core/verify-lock
    type: calls
  - target: cli/io/lock-store
    type: calls
mapping:
  - source/cli/src/cli/owner.ts
