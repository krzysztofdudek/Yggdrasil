name: SelectCommand
type: library
description: "Finds graph nodes relevant to a natural-language task description via yg select"
aspects:
  - aspect: deterministic
    anchors:
      pure-function:
        regex: "export (function|const|async function)"
  - aspect: cli-command-contract
    anchors:
      stdout-write:
        regex: "process\\.stdout\\.write"
      error-handler:
        regex: "process\\.stderr\\.write"
      exit-code:
        regex: "process\\.exit"

relations:
  - target: cli/core/loader
    type: uses
    consumes: [loadGraph]
  - target: cli/core/node-selector
    type: uses
    consumes: [selectNodes]
  - target: cli/utils
    type: uses
    consumes: [findYggRoot]

mapping:
  paths:
    - source/cli/src/cli/select.ts
