name: ImpactCommand
type: library
description: "Blast radius analysis across node, aspect, and flow modes via yg impact"
aspects:
  - aspect: deterministic
    anchors:
      pure-function:
        regex: "export (function|const|async function)"
  - aspect: cli-command-contract
    anchors:
      stdout-write:
        regex: "process\\.stdout\\.write"
      error-handler:
        regex: "process\\.stderr\\.write"
      exit-code:
        regex: "process\\.exit"

relations:
  - target: cli/core/loader
    type: uses
    consumes: [loadGraph, loadGraphFromRef]
  - target: cli/core/context
    type: uses
    consumes: [buildContext, collectAncestors, collectEffectiveAspectIds]
  - target: cli/core/drift-detector
    type: uses
    consumes: [detectDrift]
  - target: cli/commands/owner
    type: uses
    consumes: [findOwner]
  - target: cli/utils
    type: uses
    consumes: [projectRootFromGraph]
  - target: cli/model
    type: uses
    consumes: [Graph]

mapping:
  - paths:
    - source/cli/src/cli/impact.ts
