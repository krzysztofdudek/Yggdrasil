name: PackCommand
type: command
description: "Installs rules published by another repository, keeps them exactly
  as published, and adapts them in a file beside each copy. There is no registry
  and no resolver: a marketplace is an ordinary git repository with a manifest at
  its root, a package inside it is a directory of ordinary rules, a version is a
  tag, and identity comes from the URL the user typed — so a fork cannot claim the
  original's rule names. One repository holds one package of a given name at a
  time, because the record is keyed by the name. add takes the newest published
  version (or the one named, which pins it), copies the package in from that
  tag and records the tag, the commit and what every file hashed to, writing an
  adaptation stub beside each rule with its settings commented out so an
  untouched adaptation follows the package; update (in its own module) replaces
  the copy or repairs it; list says what is installed, pinned or following, and
  whether each copy is still untouched, naming a newer version only when the
  source can actually be reached; verify asks each source whether the copy is
  still what its recorded tag and commit hold; remove deletes the rules, their
  adaptations and the record, refusing while anything in the graph still names
  one of them. Adding the same package twice is refused rather than quietly
  reinstalled. Every subcommand works on the repository the graph belongs to,
  from any directory inside it, and one pack command changes the record at a
  time. Every refusal is thrown and printed once the command's cleanup has run,
  so no fetched clone is ever left behind. Every fetch runs git through an
  argument array, never a shell, because a URL and a tag are attacker-chosen
  text; and a failure quotes at most one line of git's own output inside a
  sentence this command wrote, never a raw stream or a stack. Installing a
  package means running its author's code in this process on every check — only
  what a rule READS is fenced, not the module itself — so the install output says
  so plainly rather than leaving it to documentation."
aspects:
  - provider-redaction-cascade
