name: FlowsCommand
type: library
description: "Lists all flows with metadata in YAML format via yg flows"
aspects:
  - aspect: deterministic
    anchors:
      pure-function:
        regex: "export (function|const|async function)"
  - aspect: cli-command-contract
    anchors:
      stdout-write:
        regex: "process\\.stdout\\.write"
      error-handler:
        regex: "process\\.stderr\\.write"
      exit-code:
        regex: "process\\.exit"

relations:
  - target: cli/core/loader
    type: uses
    consumes: [loadGraph]
  - target: cli/utils
    type: uses
    consumes: [findYggRoot]

mapping:
  paths:
    - source/cli/src/cli/flows.ts
