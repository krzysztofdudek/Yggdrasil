name: Check Render Groups
type: command-support
description: "Turns the findings of a check run into blocks and renders them, in the one template every finding uses: a heading `error[label] subject` or `warning[label] subject`, then lowercase labelled fields — at: (the members), why: (stated once per block), fix: — never an unlabelled line. It groups findings by code and rule and then splits a group by the why its members carry, so members whose why differs (a node that drifted beside one never verified, two node types) become blocks of their own and no why is ever printed twice in one block; a why or fix that differs between members only by their own node is stated once with <node> in it (a fix then ends 'for each node above'). The label comes from the code registry; the subject says what the block is about in a sentence (a refusal's rule and how many violations in which units, an unverified block's cause, how many files belong to no node). Members are listed per kind: a refusal one line per violation (unit, file:line, message), an unverified block one line per rule in a capped view and one `rule @ unit` line per pair in an uncapped one, a coverage block one file per line, anything else its unit beside what it says, with identical entries collapsed. A capped list ends with how much it cut and the command that shows the rest. Blocks sort errors first by tier — the graph did not load, code and graph errors, gate prerequisites, pending — then warnings. A finding outside a measured change keeps its why but gets no fix. A fill's fix carries what it costs (script pairs free, reviewer pairs paid). Colour and glyphs are decoration only, off in a pipe."
mapping:
  - source/cli/src/cli/check-render-groups.ts
relations:
  - target: cli/utils
    type: calls
  - target: cli/output
    type: calls
  - target: cli/group-issues
    type: calls
  - target: cli/check-render-header
    type: calls
  - target: cli/core/check
    type: calls
  - target: cli/core/check-codes
    type: calls
