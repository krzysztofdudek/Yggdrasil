name: Check Codes
type: utility
description: "Single source of truth for issue-code categories (structural, completeness, the fill-gating sets, the codes progressive mode may downgrade and their -outside twins, the order unverified causes are acted on in) shared between the check engine's summary tally, the fill stage and the check report's renderers, so they can never diverge; and the count of obligations a run reports outside the change, taken from those twins. Also maps the handful of issue codes whose entire input is one fixed, well-known repo file (the committed agent-rules artifacts, the incident ledger, the coverage config, the architecture file) to those real paths, for the change-accountability step to consult. Those paths are repo-relative and are IMPORTED from the modules that own each spelling (the rules-artifact names and the committed graph file names), never re-typed, because a path spelled any other way silently never matches a changed file and the finding is then judged by an input it can never see. A utility, not an engine module: the renderers are formatters, which may call a utility but never the engine, while the engine and the command layer may call a utility too, so this is the one layer every reader of a code can reach. Pure data and pure functions over codes."
aspects:
  - progressive-tier-partition
relations:
  - target: cli/utils
    type: calls
  - target: cli/model/check-issue
    type: uses
mapping:
  - source/cli/src/utils/check-codes.ts
