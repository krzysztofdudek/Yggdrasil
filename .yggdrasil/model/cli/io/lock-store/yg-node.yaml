name: IO Lock Store
type: persistence-adapter
description: >-
  Filesystem persistence for the content-addressed verdict lock — reads,
  validates, serializes and writes it, routing every write through the
  atomic-write port so a crash or signal never leaves a partial lock. It also
  merges a committed lock file for the git merge driver, as a pure function
  of three texts: the union of both sides' keys, a key only one side changed
  taking that side's value, a key both sides changed differently dropping
  out so it reads as unverified — the same bytes whichever side is ours. Besides
  the verdicts and the per-component log/closure baseline, the committed side
  now carries the port contract baselines: per port, per contract version, the
  test that was the contract and what it hashed to. Their keys are rebuilt in
  sorted order at serialization because the entry serializer renders nested
  values with a plain stringify, which preserves insertion order — the one
  place a nested structure could otherwise make the canonical bytes depend on
  the order a run visited ports in. The reader validates the section strictly,
  like every other one, so a corrupted record fails loudly instead of reading
  as an absent baseline and silently un-enforcing the contract it held. The
  gitignored side carries one more section: the standing the tool last saw each
  rule at, which is what lets a status changed by hand be written into that
  rule's own history once instead of never or endlessly. That memory is local
  and rebuildable, not committed state — it records what this checkout has
  witnessed — so it rides with the verdict cache, keeps the committed files free
  of churn, and is written only once something has actually been seen. Strictness
  is not uniform across the two sides, and deliberately so: a content fault in a
  COMMITTED file is a real, visible refusal, because that file is the source of
  truth and nothing can rederive it; the same fault in the gitignored derived
  cache is discarded and the file rebuilt from scratch, silently. That cache
  holds no truth to protect — an empty section reads as unverified, which is
  still fail-closed — while refusing over it would take the whole gate down on
  any version skew that widens the schema, which is how this actually breaks in
  the field rather than through corruption.
  The append-only baseline of each node type's decision log lives in a committed
  file of its own, read and written apart from the lock's other files: no
  release before this one opens it, so recording a type decision never makes an
  older checkout's reader fail closed, and no fill's lock write touches it, so a
  fill running beside a type decision cannot write a stale copy back. Every
  committed lock file now ignores a top-level key this release does not know —
  a section a later release added — instead of refusing it, so the next
  extension does not take older checkouts down either; inside a known section
  the shape stays strict.
  Writes are cheap to repeat: a caller can narrow a write to the split files it
  changed, and the store remembers a digest of what it last wrote to each file
  together with that file's size and time, so an unchanged file is skipped and
  a changed one written without reading the old one back — while a file some
  other writer touched since is still compared byte for byte. A synchronous
  write of the same bytes exists for a signal handler. The store also owns the
  approval lock that keeps two approvals from overwriting each other's lock,
  and the error type for a lock that could not be taken or written because of
  the environment rather than its content.
relations:
  - target: cli/model/lock
    type: uses
  - target: cli/io/atomic-write
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/model/validation
    type: uses
mapping:
  - source/cli/src/io/lock-store.ts
