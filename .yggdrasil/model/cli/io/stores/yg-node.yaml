name: IO Stores
type: persistence-adapter
description: "Filesystem readers and writers for runtime state — find index,
  artifact reading, repository scanning, the committed registers of recorded
  decisions and of proposals imported from another tool, the committed case
  corpus a rule is drilled against, and low-level fs utilities (verdict-lock
  persistence lives in the cli/io/lock-store sibling node). It also owns the
  filesystem half of consuming law from another repository — copying a package's
  files in all-or-nothing, recording what each one hashed to, writing the
  adaptation stub beside each copied rule, and taking a package back out. Nothing
  there runs git and nothing there parses a manifest: it receives an
  already-fetched directory and an already-validated manifest, which is what
  keeps the module that shells out in the helper layer and this one in the layer
  allowed to write. An install is all-or-nothing by construction — the copy is
  staged out of sight, the record is written next, and only then does the staging
  directory become the real one, so a failure at the step that can genuinely fail
  leaves no half-installed rule set behind. Beside it sits a
  separate, local cache of what each installed package's source was last seen to
  publish — knowledge about somebody else's repository rather than this one, so
  it is deliberately NOT folded into the installation record, whose stability is
  the point: that record changes only when someone installs, updates or removes
  something, while what a source has published since changes on its own and
  would legitimately differ between two machines. The cache is rebuildable and
  never committed, and losing it costs only a quiet attention feed until the next
  listing."
relations:
  - target: cli/model/graph
    type: uses
  - target: cli/model/packages
    type: uses
  - target: cli/io/atomic-write
    type: calls
  - target: cli/utils
    type: calls
