name: IO
type: library
description: "Filesystem I/O layer for parsing graph YAML files and persisting drift state"
aspects:
  - deterministic
  - posix-paths
  - yaml-parser-contract
  - silent-missing-files
relations:
  - target: cli/model
    type: uses
    consumes:
      - YggConfig
      - ArtifactConfig
      - QualityConfig
      - NodeMeta
      - NodeAspectEntry
      - NodeMapping
      - Relation
      - RelationType
      - Artifact
      - FlowDef
      - AspectDef
      - SchemaDef
      - DriftState
      - DriftNodeState

mapping:
  - paths:
    - source/cli/src/io/
    aspects:
      - aspect: deterministic
        anchors:
          pure-function:
            regex: "export (async )?function|export const"
            rationale: "Exported functions implement deterministic parsing and I/O operations."
      - aspect: posix-paths
        anchors:
          forward-slash-normalization:
            regex: "path\\.join|path\\.resolve|normalize"
            rationale: "Path operations ensure forward-slash separators."
      - aspect: yaml-parser-contract
        anchors:
          yaml-parse-call:
            regex: "parseYaml|parse.*yaml"
            rationale: "Consistent YAML parsing pipeline."
      - aspect: silent-missing-files
        anchors:
          null-on-missing:
            regex: "catch|ENOENT|exists"
            rationale: "Gracefully handles missing optional files."
