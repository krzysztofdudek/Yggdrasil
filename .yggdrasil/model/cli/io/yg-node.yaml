name: IO
type: library
description: "Filesystem I/O layer for parsing graph YAML files and persisting drift state"
aspects:
  - aspect: deterministic
    anchors:
      pure-function:
        regex: "export (async function|function|const)"
  - aspect: posix-paths
    anchors:
      forward-slash-normalization:
        regex: "replace.*\\\\/|relPath\\.replace"
  - aspect: yaml-parser-contract
    anchors:
      yaml-parse-call:
        regex: "parseYaml|parse as parseYaml"
  - aspect: silent-missing-files
    anchors:
      null-on-missing:
        regex: "\\} catch \\{"

relations:
  - target: cli/model
    type: uses
    consumes:
      - YggConfig
      - ArtifactConfig
      - QualityConfig
      - NodeMeta
      - NodeAspectEntry
      - NodeMapping
      - Relation
      - RelationType
      - Artifact
      - FlowDef
      - AspectDef
      - SchemaDef
      - DriftState
      - DriftNodeState

mapping:
  paths:
    - source/cli/src/io/
