name: LLM Shared
type: llm-shared
description: Shared LLM utilities — provider interface, registry, API helpers,
  aspect verifier, model fetcher, and reviewer connectivity test.
aspects:
  - diagnostic-logging
  # provider-redaction-cascade guards the nodes in the call chain to a provider
  # against logging/persisting raw prompt or response before redaction. This node
  # holds the aspect verifier and prompt assembly — where prompt/response data
  # actually lives — so the cascade belongs here (it was previously attached to
  # the registry barrel, which carries nothing to protect).
  - provider-redaction-cascade
mapping:
  - source/cli/src/llm/types.ts
  - source/cli/src/llm/provider.ts
  - source/cli/src/llm/api-utils.ts
  - source/cli/src/llm/aspect-verifier.ts
  - source/cli/src/llm/prompt.ts
  - source/cli/src/llm/reviewer-test.ts
  - source/cli/src/llm/model-fetcher.ts
  - source/cli/src/llm/xml-escape.ts
relations:
  - target: cli/utils
    type: calls
