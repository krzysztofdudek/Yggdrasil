name: Init Reviewer Setup
type: command-support
description: "Reviewer-provider configuration for yg init — the interactive
  provider/model wizard (provider selection, model fetch via the LLM model
  fetcher, connection test via the reviewer connectivity check) plus the
  helpers that persist the chosen tier into yg-config.yaml and a typed API key
  into the yg-secrets.yaml overlay (never a key read from the environment), and
  that remove a key stored there when the tier is pointed at another provider
  or endpoint, since a stored key outranks the environment. Extracted from the init command handler so
  the large command file carries only orchestration; registers no Commander
  subcommand."
aspects:
  - reviewer-secrets-not-from-flags
relations:
  - target: cli/llm/shared
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/model/graph
    type: uses
  - target: cli/model/validation
    type: uses
mapping:
  - source/cli/src/cli/init-reviewer-setup.ts
