name: Utils
type: utility
description: Shared helper functions — debug logging, git introspection, path
  validation, POSIX path normalization, mapping-path normalization, check.mjs
  export-shape validation, the constant list of known LLM provider ids, the
  canonical binary-extension set (single source of truth replacing two prior
  copies in mapping.ts and runner.ts), the cross-platform CLI-binary
  availability probe (runs `<binary> --version` rather than the Unix-only
  `which`, so detection works on Windows), and the pure when-predicate parsers
  (file-level and aspect-level, plus the shared boolean-clause helper) that the
  io layer imports without an io→engine boundary violation. It also owns the
  yggdrasil marker-block scanner (whole-line marker qualification, fenced-code
  awareness, start/end pair resolution) — the single parser shared by the
  installer that writes the block into a repo's agent-rules file and the
  committed-digest gate that judges it, which cannot import each other because
  an engine module may not depend on a template one. It also owns the three
  installed-artifact names (AGENTS.md, CLAUDE.md, .clinerules/yggdrasil.md) for
  the same reason — the installer, the committed-digest reader, and the check
  that labels findings with them cannot import each other, but all three may
  call utility. It also owns the one-file coverage.excluded predicate
  (normalizeRoot / matchesRoot / isExcludedByCoverage) — placed here rather
  than in the engine layer so the persistence-adapter layer (io/hash.ts,
  io/repo-scanner.ts) can call it directly while expanding a mapping to real
  files, since a persistence-adapter node may call utility but not engine. It
  also owns the raw git-history plumbing (git-history.ts) roots' history walk
  is built on — a streamed, typed `git log --raw` walk (full or resumed), a
  long-lived `git cat-file --batch` blob reader, shallow-clone detection and
  commit reachability — kept free of any roots concept (no lifecycle rows, no
  scope keys, no cache reads/writes) so the roots-engine layer above it stays
  the only place those live.
aspects:
  - posix-paths-output
