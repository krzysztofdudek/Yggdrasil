name: Core Log
type: engine
description: >-
  Log-entry orchestration — logAdd, logRead, logMergeResolve return
  structured IssueMessage-shaped results with no presentation concerns. It does
  no I/O of its own: log files are read and written through the persistence
  layer's stores, and logMergeResolve reads both sides of a conflicted merge,
  rebase or cherry-pick from git history through the utility layer's git adapter and then rewrites
  the lock's logs partition through the lock store. One
  composition step is shared by every log this tool appends to, whichever thing
  the log belongs to: the same entry shape, the same guards against text that
  would destroy the entry boundary for later readers, and the same rule that a
  new entry never carries a timestamp at or before the one before it. A rule can
  carry a log of its own beside its source, so a change to what a rule is
  measured against is recorded where the rule lives rather than only in the
  commit that made it. That log holds a rule's whole history, its STANDING
  included: a change of status recorded through the CLI is written in a fixed
  shape a later reader and a later run can both read back, and the last standing
  the tool saw is remembered beside the verdicts so that a status changed by hand
  is noticed and written down ONCE rather than passing unrecorded or being
  reported again on every run.
  Every log append — a component's or a rule's — reads, composes and replaces
  the file under a short repository-wide log-write lock, so two concurrent
  writers take turns instead of the later one silently dropping the earlier
  entry.
aspects:
  - what-why-next
  - posix-paths-output
  - diagnostic-logging
relations:
  - target: cli/core/log-validator
    type: calls
  - target: cli/core/pairs
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/core/parsing
    type: calls
  - target: cli/io/lock-store
    type: calls
  - target: cli/utils
    type: calls
  - target: cli/model/packages
    type: uses
mapping:
  - source/cli/src/core/log/aspect-log.ts
  - source/cli/src/core/log/aspect-status.ts
  - source/cli/src/core/log/log-add.ts
  - source/cli/src/core/log/log-entry.ts
  - source/cli/src/core/log/log-read.ts
  - source/cli/src/core/log/log-merge-resolve.ts
  - source/cli/src/core/log/log-gate.ts
