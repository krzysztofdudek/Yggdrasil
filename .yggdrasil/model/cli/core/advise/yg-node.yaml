name: Advise Nominations & Feed
type: engine
description: "Pure advise engine — turns the graph's live attention signals into
  stable, evidence-bound nominations (buildNominations) and folds the committed
  decision register over them into a visible/hidden feed (applyDecisions). Also
  provides pure per-node churn counting (countChurnByNode) for the uncovered-hot-spot
  nomination — the churn count itself is measured from git history at the CLI
  boundary and handed in as parsed touch sets. No I/O and no clock of its own: the
  UTC date is injected and every non-graph signal (suppress-marker anomalies, churn)
  is passed in from the CLI boundary, so output is deterministic given the graph and
  inputs."
relations:
  - target: cli/core/checks/aspects
    type: calls
  - target: cli/core/pair-inputs
    type: calls
  - target: cli/core/aspect-health-signals
    type: calls
  - target: cli/core/graph
    type: calls
  - target: cli/relations/core
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/model/graph
    type: uses
  - target: cli/model/validation
    type: uses
mapping:
  - source/cli/src/core/advise-nominations.ts
  - source/cli/src/core/advise-feed.ts
  - source/cli/src/core/node-churn.ts
