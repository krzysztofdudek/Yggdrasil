name: Type Effective
type: engine
description: "Computes the effective aspects for a source file enforced by its architecture type alone, with no component of its own: the matched type's own defaults, then each implicit parent type's defaults (walking `parents:` while it names exactly one existing type, stopping at a fork, at absent/empty `parents:`, or on a cycle), then everything reached only through `implies`. The subject is a throwaway view built for one call and discarded — never entered into the graph, never handed to a check — so the ordinary cascade (core/graph/aspects.ts) runs unchanged; this is not a second cascade. A `when:` predicate reads every total fact this file-level unit can ever answer (its type, that it maps itself, that it owns no port, that it has no descendants) and reads every relation atom from an optional statically-resolved import edge index, never from a declared node relation this file has none of."
aspects: []
relations:
  - target: cli/core/graph
    type: calls
  - target: cli/utils
    type: calls
mapping:
  - source/cli/src/core/type-effective.ts
