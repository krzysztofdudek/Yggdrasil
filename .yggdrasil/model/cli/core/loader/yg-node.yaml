name: GraphLoader
type: library
description: Loads the graph from .yggdrasil/ — model nodes, aspects, flows, schemas — into memory
aspects:
  - deterministic
  - silent-missing-files
relations:
  - target: cli/io
    type: uses
    consumes:
      - parseConfig
      - parseNodeYaml
      - parseAspect
      - parseFlow
      - parseKnowledge
      - parseSchema
      - readArtifacts
  - target: cli/model
    type: uses
    consumes:
      - Graph
      - GraphNode
      - YggConfig
      - AspectDef
      - FlowDef
      - KnowledgeItem
      - SchemaDef
  - target: cli/utils
    type: uses
    consumes:
      - findYggRoot
mapping:
  - source/cli/src/core/graph-loader.ts
