name: DependencyResolver
type: library
description: "Topological sort, change detection, and dependency tree formatting for graph nodes"
aspects:
  - deterministic
relations:
  - target: cli/model
    type: uses
    consumes: [Graph, Stage]

mapping:
  - paths:
    - source/cli/src/core/dependency-resolver.ts
    aspects:
      - aspect: deterministic
        anchors:
          pure-function:
            regex: "export (async )?function"
            rationale: "Exported functions implement pure logic with deterministic behavior."
