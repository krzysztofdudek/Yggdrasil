name: Aspect Checks
type: engine
description: "Validation checks for aspect definitions and contracts — dangling
  refs, id uniqueness, implied-aspect existence and acyclicity, orphaned
  aspects, when-predicate references, rule-source exclusivity, reviewer
  presence, tier references, reference files, and status-downgrade detection.
  The two dead-attach linters (checkAspectEffectiveNowhere,
  checkArchitectureDefaultAspectUnreachable) take an optional type-coverage
  classification: a type with no components but a matching file has instances
  too, and a rule reaching that file is live law, not dead, ONLY when it could
  actually produce a pair there (computeTypeReachableAspects) — a whole-unit
  (per: node) rule has no component to run on for a type-covered file, so it
  stays reported dead even once a file matches its type. Absent ⇒ unchanged,
  one-argument behavior."
aspects:
  - posix-paths-output
  - what-why-next
relations:
  [
    { target: cli/core/checks/architecture, type: calls },
    { target: cli/core/graph, type: calls },
    { target: cli/core/pairs, type: calls },
    { target: cli/formatters, type: calls },
    { target: cli/io/stores, type: calls },
    { target: cli/model/graph, type: uses },
    { target: cli/utils, type: calls },
    { target: cli/core/type-effective, type: calls }
  ]
mapping:
  - source/cli/src/core/checks/aspects.ts
  - source/cli/src/core/checks/aspect-contracts.ts
