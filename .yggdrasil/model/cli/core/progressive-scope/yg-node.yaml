name: Progressive Scope
type: engine
description: "Pure burn-set helpers for the progressive-mode scope engine —
  given a graph, answer which other graph elements a starting point reaches:
  impliesClosure (unconditional structural closure over an aspect's `implies`
  edges, deliberately not the node-bound, `when`-filtered expandImpliesFiltered
  in core/graph/aspects.ts), buildReverseTargetIndex (target nodePath ->
  every node declaring ANY relation to it, not only port-consuming ones), and
  collectFlowParticipants (a flow's declared nodes plus their descendants).
  No I/O, no `when` evaluation, no node binding — graph in, sets/maps out. A
  later stage composes these into 'which rules does this change reach'."
relations:
  - target: cli/core/graph
    type: calls
  - target: cli/core/pairs
    type: calls
mapping:
  - source/cli/src/core/progressive-scope.ts
