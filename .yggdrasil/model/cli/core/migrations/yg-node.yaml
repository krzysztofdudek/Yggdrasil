name: Migrations
type: library
description: "Schema version migrations for Yggdrasil graph files — migrates from old versions to current"
blackbox: false

aspects:
  - aspect: deterministic
    anchors:
      pure-function:
        regex: "export (async function|function|const)"

relations: []

mapping:
  - paths:
    - source/cli/src/core/migrator.ts
    - source/cli/src/migrations/
