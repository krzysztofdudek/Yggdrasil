name: Fill
type: engine
description: "Fill stage behind yg check --approve — the single producer of
  verdict-lock entries. Computes unverified pairs, runs the deterministic-first
  gate (det fills before LLM; a node's enforced det refusal skips its LLM
  fills), hands the surviving LLM pairs to reviewer dispatch, enforces the
  mandatory-log gate, and on positive closure writes the source fingerprint and
  log baseline. When its caller measured the current change, only the LLM pairs
  that change is accountable for are handed on — by the same per-pair decision
  the report gates with, never a second copy of it. The deterministic half stays
  whole-project (free, and its recorded observations are what the next
  measurement reads) and so does the mandatory-log gate, which is all-or-nothing
  about the code as it stands. The subject counts and reviewer-call budget the
  stage reports are therefore computed separately from that gate's component
  set, from what the run will actually fill, with whatever was left alone named
  out loud. GCs detached verdict entries and writes the lock canonically. No
  write ever happens on an infra disposition (provider unreachable,
  tier-resolution error, reference-load failure, unparseable response) or a
  tainted/failed deterministic result. One orchestrator owns the ORDER of those
  steps and nothing else; each step is a module of its own — pair classification
  and cost budgeting, the serialized lock writer and its verdict telemetry, the
  deterministic phase, the cost preview, and everything the stage says out loud.
  Talking to the model is NOT one of those modules: this stage sequences the
  reviewer phase and owns the fail-closed write chokepoint every verdict passes
  through, but the reviewer calls themselves live in a separate node whose code
  is a different kind — answers from a model are not reproducible call-to-call,
  so that code cannot be held to the same-input/same-output rule this stage is
  held to. Keeping the two apart lets this orchestrator be judged deterministic
  in full, with no suppressed island inside it. The primitives both of them stand
  on — the stage's contract and gate predicates, the shared outcome shapes, the
  bounded worker pool — belong to neither and are owned by a substrate node
  instead, so neither has to depend back on the other to reach them. The
  per-(rule, component) parse caches sit lower still, in a node of their own, so
  that lock verification can share them without reaching anything that depends
  back on the check report."
max_direct_relations:
  limit: 25
  reason: >-
    Reviewed architectural seam. This node is the SINGLE producer of verdict-lock
    entries and the fill orchestrator — it fans out to every subsystem a
    --approve run must coordinate (pair computation, the deterministic-first
    gate, the reviewer phase, the fail-closed lock writer, the mandatory-log
    gate, source-fingerprint/closure recording, and detached-entry GC). Its high
    direct-relation count concentrates that orchestration in one auditable place
    by design; splitting the NODE was deliberately deferred by the maintainer
    because dividing the single write chokepoint across nodes would weaken the
    fail-closed guarantee. That decision is about the node, not about file size:
    the stage's modules are split freely inside it, and every one of them stays
    mapped here so the orchestration keeps a single owner and this count does
    not grow with them. The ceiling is set to the exact reviewed count, so any
    NEW dependency beyond it pushes the node over its own ceiling and re-raises
    the warning.
    Raised from 21 to 22 for a reviewed dependency on the log-history validator:
    the closure step records a node's log baseline, and a correctness fix now
    validates that baseline against tampering before recording it, rather than
    trusting a working-tree log that a merge or hand-edit could have rewritten.
    Raised from 22 to 24 for two more genuine dependencies, added when
    type-level coverage classification was threaded into this stage's own
    verifyLock/GC calls (the anti-prune lever that keeps a type-covered file's
    already-stored verdict from being garbage-collected once its type
    classification is known): cli/core/type-coverage (the SAME classification
    runCheck computes once per run) and cli/io/file-content-cache (the shared
    content cache that classification reads through). Both are real calls this
    stage's own code makes, not incidental coupling.
    Lowered from 24 to 23 when the reviewer calls and the stage's phase-agnostic
    substrate each moved to a node of their own. Two edges left with the reviewer
    code — the provider factory and the companion resolver were reached only from
    what talks to the model — and two arrived: one to the dispatch node, one to
    the substrate node. The ceiling tracks the reviewed count down as well as up;
    leaving it at 24 would have banked a unit of unearned headroom and let a
    future dependency arrive unreviewed.
    Raised from 23 to 24 when the per-(rule, component) parse caches moved out of
    that substrate node into one of their own. This stage's dependency on them is
    not new — it already reached them through the substrate — but the edge is now
    its own and therefore counted. The split was forced rather than chosen: lock
    verification began sharing the same caches, and it cannot depend on the
    substrate, which reaches back to the check report. Nothing this stage calls
    changed; only which node owns the code it was already calling.
    Raised from 24 to 25 for the burn-set engine. When a run is measured against a
    change, this stage decides which reviewer work to buy and, at closure, which
    unbought rule may be treated as settled — both keyed by the SAME pair identity
    the scope engine defines. It reads that identity from the engine that owns it
    rather than re-spelling it here, because a second spelling of a key silently
    never matches, and the two places that would have to agree are the one that
    declines to buy a rule and the one that later decides the component is
    settled — a disagreement there would leave a component's justification cycle
    open forever. Routing it through an already-declared neighbour instead would
    have kept this count down while hiding a dependency that is genuinely made.
