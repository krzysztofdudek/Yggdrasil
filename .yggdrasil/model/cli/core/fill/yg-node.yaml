name: Fill
type: engine
description: "Fill stage behind yg check --approve — the single producer of
  verdict-lock entries. Computes unverified pairs, runs the deterministic-first
  gate (det fills before LLM; a node's enforced det refusal skips its LLM
  fills), dispatches LLM reviewer calls per tier with a single fail-closed write
  chokepoint, enforces the mandatory-log gate, and on positive closure writes
  the source fingerprint and log baseline. GCs detached verdict entries and
  writes the lock canonically. No write ever happens on an infra disposition
  (provider unreachable, tier-resolution error, reference-load failure,
  unparseable response) or a tainted/failed deterministic result."
max_direct_relations:
  limit: 21
  reason: >-
    Reviewed architectural seam. This node is the SINGLE producer of verdict-lock
    entries and the fill orchestrator — it fans out to every subsystem a
    --approve run must coordinate (pair computation, the deterministic-first
    gate, per-tier LLM dispatch, the fail-closed lock writer, the mandatory-log
    gate, source-fingerprint/closure recording, and detached-entry GC). Its high
    direct-relation count concentrates that orchestration in one auditable place
    by design; a split was deliberately deferred by the maintainer because
    dividing the single write chokepoint would weaken the fail-closed guarantee.
    The ceiling is set to the exact reviewed count (21), so any NEW dependency
    beyond this pushes the node over its own ceiling and re-raises the warning.
aspects:
  - deterministic
  - posix-paths-output
  - what-why-next
  - diagnostic-logging
  - provider-redaction-cascade
relations:
  - target: cli/core/check
    type: calls
  - target: cli/core/pairs
    type: calls
  - target: cli/core/verify-lock
    type: calls
  - target: cli/core/pair-inputs
    type: calls
  - target: cli/core/reviewer-tiers
    type: calls
  - target: cli/core/validator
    type: calls
  - target: cli/io/lock-store
    type: calls
  - target: cli/llm/shared
    type: calls
  - target: cli/llm/registry
    type: calls
  - target: cli/model/graph
    type: uses
  - target: cli/model/lock
    type: uses
  - target: cli/core/check-codes
    type: calls
  - target: cli/core/log
    type: calls
  - target: cli/core/pair-hash
    type: calls
  - target: cli/io/parsers/config
    type: calls
  - target: cli/io/stores
    type: calls
  - target: cli/relations/core
