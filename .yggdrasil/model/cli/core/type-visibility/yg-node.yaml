name: Type Visibility
type: engine
description: "Assembles the honesty artifact for the type-level coverage tier: for every file enforced by its architecture type alone, which rules attached to that type enforce on it, which run but only warn, which do not run at all, and why — merging four producers: the static pair-enumeration drops (when-not-satisfied, draft, whole-unit-rule, scope.files-excluded, an id with no matching aspect definition, an unreadable subject, an LLM rule over a binary subject), the deterministic runner's own typed dispositions (reading beyond the architecture's allowance, touching component-only context — fill-only, never live at yg check or yg context --file), the real (file, aspectId, status) pairs that actually ran, and the files whose type's rules were never resolved at all because the nodeless enumeration's cascade call absorbed an aspect implies cycle for them — grouped by the cycle's aspect id, reported separately from (never folded into) the zero-applicable-rules bucket, since 'resolution ran and found nothing' and 'resolution never ran' are distinct facts. Builds no reason of its own — a pure assembler over what the producers already decided — but never infers 'enforced' from the absence of a drop: that derivation reads only the real applied-pair set, so a gap in the drop-producing side can never be misread as enforcement. The one other graph fact it computes directly is where a type's implicit parent chain stops."
aspects: []
relations:
  - target: cli/model/graph
    type: uses
  - target: cli/core/pairs
    type: calls
  - target: cli/core/type-effective
    type: calls
mapping:
