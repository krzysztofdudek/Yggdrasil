name: Check
type: engine
description: "Unified check orchestrator — runs validation, coverage, the
  prompt-size gate, and lock verification (read-only: every expected pair's
  stored verdict is re-hashed against current inputs and rendered as pass,
  cached refusal, or unverified), then log integrity, and computes the suggested
  next command. Write-free: the lock is produced only by the fill stage behind
  yg check --approve. When coverage.type_level is on, the coverage section also
  runs the type-level classification lattice (core/type-coverage.ts) over every
  uncovered file: a single classifying-type match is silently satisfied, 2+
  non-strict matches raise a blocking ambiguous-node-type error, and a match
  with no type at all gets a message saying so. Also assembles
  CheckResult.typeVisibility (core/type-visibility.ts) from the lock
  verification's drops and uncomputable-type-coverage list: what a
  type-covered file's type enforces, does not, or could never resolve (an
  implies cycle), and why. One orchestrator owns the ORDER of those steps —
  and the injected-input gating that decides which optional checks run at all
  — and nothing else; each cohesive stage is a module of its own: the public
  issue/result contract, one pair's verdict translated into its issues, log
  integrity plus the mandatory-log requirement, everything gated on a readable
  lock, the uncovered-file and tracked-but-gitignored scans, the coverage
  tiers plus the type-level lattice, the change-scope classification that
  re-codes a finding the current change is not accountable for into a
  non-blocking twin, the byte guard's gathering half that collects the files
  behind every blocking FINDING that classification is about to treat as
  inherited — driven by the assembled findings rather than by rule checks alone,
  since a finding keyed by a component or a file carries no rule check at all —
  together with what those files currently contain, so the pure comparer in
  core/progressive-scope.ts can re-admit any whose content contradicts git's own
  report of what changed (together with the component -> rule-check index that
  re-admission reads, so re-admitting a component re-admits every check it
  owns), and the single next step a finished check points at.
  The orchestrator owns the byte cache the verification fills, so the guard
  compares the very bytes each verdict was re-hashed from rather than reading
  the same files again, and reports how many findings the guard kept."
max_direct_relations:
  limit: 25
  reason: >-
    Reviewed architectural seam. This node is the single read-only orchestrator of
    `yg check`: it composes every check module and every source of facts one report
    must reconcile — the structural/completeness validators, coverage and tiering,
    lock verification, log integrity, the live relation-conformance pass, and the
    standalone gates wired directly into runCheck (review cadence, committed-digest
    drift). About half its edges are the check modules themselves; the rest are the
    graph, lock and validation models, the formatters, and the io helpers those
    checks and this node's own feature-index output require. The count grows by one
    each time a new check is added, which is the intended shape: keeping the
    composition in one auditable place is what lets a single run produce one
    consistent issue set and exit code. The ceiling is the current count (24, after
    the scope engine whose burn-set shape this node's options contract names) plus
    modest headroom, so one more check lands without churning this allowance while a
    larger jump still re-raises the warning for review.
