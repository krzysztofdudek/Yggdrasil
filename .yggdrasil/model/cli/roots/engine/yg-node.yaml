name: Roots Engine
type: roots-engine
description: "Roots mining engine — pure, deterministic convention-mining
  computation. Maps the config seam (config.ts: rootsConfigHash, a pure
  sha256-of-canonical-JSON fold over the parsed roots config subtree),
  binding derivation (binding.ts: deriveBinding — spec §6.2's scope/import/
  decorator node-type sets, heritage pattern, and the grammar's complete
  declared named node-type vocabulary (E3's literal grammar-whose-vocabulary-
  holds-t domain, threaded through extraction onto every raw scope rather
  than reconstructed later from a file's extension), derived purely from a
  grammar's already-parsed node-types.json; the lexical decoration-marker
  predicate and decoration attribution-window test extract.ts consumes;
  bindingHash, the per-grammar canonical-JSON content hash a later pipeline
  folds across every grammar used into the model header's own bindingHash
  field), and the three-phase extraction/enumeration split (spec §6-§7):
  extract.ts's extractUnits (per-file, pure, sync scope discovery — named-body
  scopes plus the one file scope, occurrence ordinals, decoration/heritage
  attribution) and finalizeUnits (final partitionIds, module-scope synthesis,
  skeyR, stable_id); partitions.ts's derivePartitions (spec §6.8 package-root
  detection, the 300-scope floor, the _repo merge, J4) and the
  makeRootsFileFilters two-flavor exclusion factory; enumerate.ts's
  buildVocabularies (spec §7.2 per-partition vocabulary selection) and
  enumerate (the twelve generic feature-space enumerators, spec §5's sparse
  boolean domains, and the §7.3 static surface-to-overlap-group map); and
  role induction (spec §8, roles.ts): buildRoleFeatureBag (the §8.1
  catalog-free feature bag — tok:/sup:/dec:/imp:, the _untyped
  minOwnFeatures gate), roleJaccard (§8.2), induceRoles (§8.3's per-partition
  bucket-weighted average-linkage clustering with an incremental-DL MDL cut,
  §8.4's own-features-only nearest-medoid classifier, §8.5's clone-aware
  ambiguity, §8.6's assignments-map ENABLING half plus its own
  build-time-only `ambiguousRank1` companion map (an ambiguous scope's
  rank-1 roleKey, keyed identically to `assignments`, recovering what
  `assignments`' own `'-1'` marker discards — never serialized, consumed
  only by mine.ts's own role-cell/seed/role_lift stages below), §8.8's role identity —
  role_key/label/definingFeatureGroups, both fresh from the spec text with
  no reference implementation — and §8.9(b)'s file-role plurality, also
  fresh from the spec text), and roleLift (§8.10's pure formula over
  supplied counts, held-out overlap-group exclusion, the isDecorativeRole
  <=0 test) — the OWNERSHIP SPLIT stated on `RoleInfo`'s own doc: role_lift
  is invoked from the real §9.4 counts by the MDL acceptance chain's one
  counting pass, never a second implementation of that math — landed here as
  mine.ts (the Appendix-D MinedModel body, mine()'s named stages: cell
  construction over enumerate.ts's sparse bags+domains — a boolean
  surface's candidate universe per kind is domain-intersection-derived, not
  observed-true-bag-key-derived, so a cross-kind surface (e.g.
  auto.deco:/auto.extends:, spanning method+type) stays mineable on a kind
  where it is always false; role cells admit an ambiguous member (via
  roles.ts's own `ambiguousRank1`) at half weight alongside confident
  members at full weight, §8.5's own weight-index rule — seed injection,
  role_lift + decorative demotion (role_lift's n_eff(r) sums EVERY rank-1
  member, ambiguous included, at full w_base — a different population from
  the half-weighted role-cell counts), the repo-wide candidate count C with the
  §7.3 tautology skip applied before it, §9.4a/b/c scoring with acceptance
  and hook-eligibility as separate stages — eligibility gates 1-4 are
  flag-setters, never fact-droppers — the §9.4d vacuous filter (its own
  true-raw population is summed partition-wide across every kind sharing a
  surface's domain, not scoped to one cell's own kind), §9.4i
  redundant-refinement pruning, §9.4e correlation dedup (scoped strictly
  within one cell — an identical conform set in two different cells never
  merges), the §9.4h factCap cull (ranked by bits-per-instance), and
  moduleOfFile (derived from finalizeUnits' own already-minted `module`
  units, never an independent re-walk) and mine-stages.ts (the split-out cell-counting/KT-scoring
  math, kept in a sibling file purely to stay under the per-file LLM-review
  prompt ceiling; its serialized `counts`/`moduleOfFile` records build via
  `Map` + `Object.fromEntries`, never plain-object bracket-assignment, so a
  mined value literally named `'__proto__'` is never silently dropped). pipeline.ts composes every stage — parseAndExtractAll
  (the walk+filter+parse+extract prefix, spec §6.1's robustness rules) and
  runRootsIndex (partitions → finalizeUnits → vocabularies → enumerate →
  roles → mine, constructing R1's WeightFn=weights.noLifecycleWeight default
  and no AgeFn) — without persisting; stores.ts stays untouched, per Task 1's
  seam. R4 Task 4 adds history.ts: the blob-record extraction seam —
  extractBlobRecord (per-file pure extraction against a historical blob's
  content, mirroring pipeline.ts's own live-path gates: history.blobMaxBytes,
  the 40 000-line cap now exported as pipeline.ts's MAX_PARSE_LINES, D17 gate
  2 via partitions.ts's makeRootsFileFilters, and the SAME extractUnits the
  live path calls, so both key spaces share ordinals per R4-I7) and
  makeBlobRecordReader (the read-through cache over io/roots-blob-cache.ts:
  probe the shard, extract on a miss, write-through with the two grammar
  constants stripped per D11, one onParsed() per genuine miss). blobCacheKey
  folds a blob sha, extract.ts's own EXTRACTOR_VERSION and the PER-GRAMMAR
  bindingHash binding.ts's bindingForAsset resolves from the historical
  path's extension — never the all-grammar header fold. binding.ts's
  assetNameOfWasmFile/bindingForAsset (lifted from pipeline.ts, Task 4) are
  now the ONE per-grammar-per-process binding cache both the live and
  historical extraction paths share. R4 Task 5 adds history-replay.ts: the
  lifecycle/value-event/alias REPLAY — replayCommit folds one commit's file
  records into per-scope and per-file lifecycle rows, D5's raw value-tuple
  change events, and raw rename edges, with NO state carried between calls
  (each record is compared against its own pre/post blob images via
  BlobRecordLookup, never a running previous-value map); finishReplay derives
  the alias closure (one linear pass, never a fixpoint), decides the
  lifecycleMaxAppearances demotion per raw, pre-alias path against each raw
  file-level row's own touch count, then rewrites and merges rows/events
  through the closure and drops a merged scope row (or event) in full once
  its final key was reached by any demoted raw path — never against, and
  never applied to, the merged file-level touch totals themselves, which
  always survive carrying the full pooled history — and returns a totally
  sorted ReplayResult. Every field is a set function of a row's touches with
  a stated (ts, sha) tie-break, so replayCommit may be handed the same
  commits in any order and finishReplay returns byte-identical output — the
  property a resumed index equal to a full one depends on, which the
  alias-merge counter math (a sum of each source row's own persisted
  modifications, not a per-run sha-set union) is itself chosen to preserve.
  R4 Task 6 adds history-cochange.ts: the co-change accumulator and its
  coupling projections — accumulateCochange folds one already-gate-1-
  filtered commit's changed-file set into per-pair support and per-file
  commit counts, applying no exclusion of its own beyond §13.5's own
  2..megaCommitFileCap changed-file band, and skipping nothing else (a path
  with no registered grammar or excluded from parsing still counts in full,
  §6.8's 'fully counted for co-change and history' carve-out); finishCochange
  derives the finished products without mutating the accumulator — resolving
  every raw pair and per-file commit count through an injected rename-alias
  closure and merging what lands on the same final path, computing
  max-direction confidence, filtering by minSupport/minConfidence, then
  sorting by descending support (ties broken by the pair's own two paths)
  BEFORE cutting to maxPairs so the cut can never drop the strongest pair by
  insertion accident, and finally ranking each file's percentile among the
  cut set's distinct coupling partners with the per-module figure as the
  rounded median of its own files' percentiles, grouped by parent directory
  rather than by the mining engine's own partition-aware module boundaries
  (this pass runs once, repo-wide, before partitioning is even consulted).
  Every accumulated quantity is a plain integer sum, so folding the same
  commits in any order — or split across a persist/reload boundary — leaves
  the accumulator, and therefore the finished output, unchanged; the rename
  fold happens exactly once, at finish, never as a running remap during
  accumulation, so which order a rename and its co-changes arrive in during
  one run can never change the merged result. R4 Task 7 adds weights.ts: §9.1's
  instance weights, a pure module transcribing the spec's five arithmetic
  lines (survival, provenance, churn, base, the ledger cap) as five named
  helpers, composed by makeWeightFns into the per-scope w_base function
  roles/§8.9b consume and the per-(scope,surface) w(s,q) function mining
  consumes — the ledger cap applied LAST, after every degraded-mode branch
  base(s) may have taken (no lifecycle row, or a dirty working tree), never
  folded into the survival x provenance x churn product itself, so a marked
  scope in a degraded branch is still capped rather than silently escaping
  it. releasedMarks evaluates §18.3's release rule per mark from the marked
  scope's own lifecycle row (stable_days against releaseStableDays, a human
  non-merge touch at least releaseMinDaysAfterMark after the mark date),
  returning the released subset so the caller filters the ledger down to
  unreleased marks before this module ever sees them. A module-kind unit's
  relPath is a directory (finalizeUnits' own synthesis), so it can never
  resolve a lifecycle row through either of rowFor's two keyed lookups — a
  real, spec-consistent consequence rather than a bug: no module-level fact
  can be hook-eligible in R4. R4 Task 9 adds history-resume.ts — split out of
  history.ts purely to stay under the per-file LLM-review prompt ceiling, not
  a change of ownership: computeInputsHash folds a pure ingredient tuple
  (the replay state's own schema version, extract.ts's EXTRACTOR_VERSION,
  every REGISTERED grammar's own per-grammar binding hash, and the canonical
  history:+include/exclude config subtree) into the hash that decides whether
  a stored state still applies; decideWalkMode is the mechanical statement of
  when a walk may resume (no usable state, an inputsHash mismatch, an
  unreachable lastIndexedSha, active windowing, or an explicit full request
  all force a full walk; nothing else does); and the state round-trip
  (parseResumeState and its per-row helpers) deep-parses a loaded, generically
  typed replay state back into the shapes history-replay.ts's
  deserializeReplayState/history-cochange.ts's deserializeCochangeState need
  to resume onto, falling the WHOLE state back to unusable on the first
  malformed row anywhere rather than guessing at a partial resume.
  buildHistoryJoin (history.ts) is the only production caller: it resolves
  the walk mode once per run, seeds the replay/co-change accumulators and the
  two blob/key rosters from a resumed state when the verdict allows it, walks
  only the delta range, and always persists the new six-file state (as a set,
  D15's write order) at the end of a successful walk, whether resumed or
  full — the resume anchor written is always the current run's own HEAD, on
  either path. pipeline.ts's own one authorized Task 9 edit lifts the
  used-grammar-set + bindingSetHash fold out of runRootsIndex into a
  standalone computeUsedGrammarSetHash(repoRoot, config): a DERIVED, cold-safe
  re-pass over the parse-candidate set (never a read of the process-lifetime
  binding cache runRootsIndex itself warms), which is what lets the command
  layer compute the model header's bindingHash before mining ever runs, for
  the no-op short-circuit's own input comparison."
