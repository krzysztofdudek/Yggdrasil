name: Entry
type: service
description: "CLI entry point that bootstraps Commander and registers all yg subcommands"
aspects:
  - cli-command-contract
relations:
  - target: cli/commands/init
    type: uses
    consumes: [registerInitCommand]
  - target: cli/commands/build-context
    type: uses
    consumes: [registerBuildCommand]
  - target: cli/commands/owner
    type: uses
    consumes: [registerOwnerCommand]
  - target: cli/commands/tree
    type: uses
    consumes: [registerTreeCommand]
  - target: cli/commands/impact
    type: uses
    consumes: [registerImpactCommand]
  - target: cli/commands/aspects
    type: uses
    consumes: [registerAspectsCommand]
  - target: cli/commands/flows
    type: uses
    consumes: [registerFlowsCommand]
  - target: cli/commands/select
    type: uses
    consumes: [registerSelectCommand]
  - target: cli/commands/check
    type: uses
    consumes: [registerCheckCommand]

mapping:
  - paths:
      - source/cli/src/bin.ts
    aspects:
      - aspect: cli-command-contract
        anchors:
          stdout-write:
            regex: "program"
            rationale: "Bootstrap file registers all commands with the commander program."
          error-handler:
            regex: "register.*Command"
            rationale: "Delegates error handling to registered command handlers."
          exit-code:
            regex: "program\\.parse"
            rationale: "Parses command line and handles exit codes via commander."
