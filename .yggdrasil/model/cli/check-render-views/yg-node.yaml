name: Check Render Views
type: command-support
description: "The yg check report's views over one hierarchy: the verdict line, a partial-result banner when part of the graph did not load, the finding blocks, standing notes (one note: line each, after the findings), and the next: / then: lines last. The view decides only which blocks show and how many members each lists — full (capped), details and --aspect (every member), --top N (the first N blocks and how many more there are), --summary (one rollup line per severity: each label and its count, an unverified count split into script and reviewer pairs) or --summary nodes (one row per node, zero counts left out) — and every view prints the same verdict line with the true counts and a view: tag. It owns the Next contract: next: is the first step of the first block (so never a fill while a code or graph error stands), as a runnable yg command or an edit of a named file and line, with the node, the file and the user's own flags filled in; it is annotated with the block it belongs to and how many errors still need a code or graph fix, never restates a code, and is left out when the only block's fix already is the step; then: names the fill once the fixes are in; a run with nothing blocking and something outside the measured change points at the full audit. The same step is the yg-check/1 document's suggestedNext (the next: line's text) and its next object (command, text, target, cost, remaining, then), and the document also gets each finding's label and the report's blocks (subject, cause, the shared why and fix, members as indexes into the findings) and the banner. It also renders a recording run a gate stopped — an ABORTED verdict line keeping the `yg check:` anchor, the gating findings as blocks, next: with the first node filled in and then: re-running the user's own command — as a report and as a yg-check/1 document with exit status aborted, and the log entries a cost preview says a recording run would stop on."
mapping:
  - source/cli/src/cli/check-render-views.ts
