name: CLI Exit After Flush
type: command-support
description: "Command-layer support helper through which a command ends the process after writing output (check, aspect-test, impact, adopt, context, find and others); an error exit goes through failAndExit in the output layer instead, and the no-raw-process-exit rule refuses a bare process.exit anywhere else in the command layer. exitAfterFlush drains the pending stdout buffer before calling process.exit, so a long report sent to a pipe is not truncated by the kernel terminating the process before the buffer flushes, while preserving force-exit semantics (no hang on a lingering handle). Imports only node:process, so it declares no relations."
mapping:
  - source/cli/src/cli/exit-after-flush.ts
