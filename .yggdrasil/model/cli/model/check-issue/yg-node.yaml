name: CheckIssueTypes
type: types
description: "The data contract of a check run. One issue of it (its code, the uncovered files of an unmapped-files issue, the reviewer kind of a pair-derived issue, and why a pair is unverified) and the vocabulary of unverified causes: infrastructure causes a re-run cannot fix, and the ordinary states of a pair waiting for a fill. And the whole result the run hands back (the counts, the issues, the classified pairs, the type-level split and report, and the progressive measurement: the obligations outside the change, the reference it was measured against, the byte guard, the standing noise floor), with that noise floor itself: advisory refusals and enforced findings standing on code the change never touched. Pure types in the model layer, so every module that builds or reads an issue or a result, the ones the check orchestrator calls and the report renderers included, names them without depending back on the orchestrator; core/check-contract.ts and core/check-codes.ts re-export them."
aspects: []
relations:
  - target: cli/model/validation
    type: uses
  - target: cli/model/verified-pair
    type: uses
  - target: cli/model/type-visibility
    type: uses
mapping:
