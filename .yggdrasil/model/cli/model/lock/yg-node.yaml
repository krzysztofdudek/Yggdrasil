name: LockTypes
type: types
description: Content-addressed lock file types — LockFile, VerdictEntry, LockNodeEntry, and unit-key helpers for the single committed verdict store that replaces per-node drift-state baselines. Also pairsMissingFromLock, a cheap O(1)-per-pair presence check (has an entry at all — never a full re-verification of its hash) that a single-file lookup command can afford to pay for an honesty caveat without the cost of re-verifying the whole graph.
