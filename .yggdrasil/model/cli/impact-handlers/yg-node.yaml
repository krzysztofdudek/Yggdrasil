name: Impact Handlers
type: command-support
description: "The three yg impact targets answered from a graph object rather than a file: a rule (--aspect), a flow (--flow) and a type (--type). Each refuses a target the graph does not hold, in the command's error grammar, asks the engine for the facts and prints them as the formatter words them; a type's answer is printed part by part as each part is known. Nothing is computed or worded here. Registers no Commander subcommand; invoked by the impact command via direct import."
relations:
  - target: cli/output
    type: calls
  - target: cli/core/impact
    type: calls
  - target: cli/formatters
    type: calls
  - target: cli/model/graph
    type: uses
  - target: cli/model/lock
    type: uses
mapping:
  - source/cli/src/cli/impact-handlers.ts
