name: E2E Tests — What a log entry is owed for and what a missing one stops
type: test-suite
description: "Subprocess E2E for the log contract, from a recorded baseline: an edited rule, a declared relation and lost verdicts re-open pairs and owe no entry; a change to a component's own source owes one and stops the recording run before it records anything; a changed component the run fills nothing of — one with no rules, or one whose only pending pairs are reviewer pairs under the free run — stays red on the plain read but does not stop the run. Also: every re-run line a fill names keeps the flags it was invoked with, and the documented merge recipe ends green — merge-resolve names the entry a merge that combined a component's code owes, and asks none for a merge that changed only the log."
aspects: []
