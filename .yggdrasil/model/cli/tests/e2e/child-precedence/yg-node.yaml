name: E2E Tests — Child-Precedence Ownership
type: test-suite
description: "Subprocess E2E proving child-precedence (child-wins) ownership through the public CLI — a child node claiming a specific file inside a directory its parent globs owns that file: yg check is green with no overlapping-mapping, yg owner names the child, and yg context carves the file out of the parent and into the child. Also proves the same precedence holds in the relation-conformance pass: a child-owned file's outgoing dependency is checked against the CHILD's declared relations, so the parent is never falsely refused for a dependency the child declared."
