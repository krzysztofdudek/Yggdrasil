name: E2E Tests — Feature-Field Index, Attention Dump & Context Note
type: test-suite
description: "Subprocess E2E over the public CLI: yg check maintains the local,
  gitignored feature-field index (git never stages it and the .yggdrasil
  gitignore carries the line), the hidden --attention-dump prints plain-language
  calibration output, exits 0, and writes nothing, and yg check --approve
  --dry-run writes no index. Also covers the advisory structural-attention note
  in yg context --file: it prints the verbatim line for a live outlier (exit 0),
  stays silent for a non-outlier and for a stale index (bytes changed since the
  index wrote), and is suppressed by signals.attention: false. Also covers the yg
  advise structural-deviation aggregate line: it shows one bare count of the files
  the index still records as live outliers (a stale entry excluded), omits the line
  when the count is zero, and exits 0. Also covers the yg advise uncovered-hot-spot
  nomination: a zero-aspect node that churns across recent commits is nominated with
  its churn count, capped file evidence, and provenance (a node covered by an
  enforced rule is never nominated), while a repo with no commits and a non-git
  directory alike leave the class silent — churn is never fabricated. Also covers
  the yg advise type-covered-churn nomination: a file with a matched architecture
  type but no component of its own is nominated when it churns, naming the file,
  its churn count, and its matched type; two such same-type files importing each
  other upgrade the evidence to a cluster; a file under a coverage.excluded root is
  never attributed churn or nominated; and with the type tier off, output is
  byte-identical whether or not a matching type is even declared. Spawns the
  built bin.js; no source imports."
