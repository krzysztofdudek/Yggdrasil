name: E2E Tests — Progressive View Line
type: test-suite
description: "Subprocess E2E for the read-only progressive view line on `yg
  check`, driven through the real built binary over a throwaway git repository
  holding a minimal real graph: two components, one deterministic rule, and one
  pre-existing refusal recorded on the reference branch that no later change
  touches. It proves the split counts correctly (the edited component's
  obligation is the change's business; the untouched refusal is not), that the
  line disappears under the whole-graph flag and when the reference cannot be
  resolved, and — the guarantee the whole feature rests on — that a project
  naming no reference produces byte-identical output and the same exit code as
  before the feature existed, with everything below the one added line agreeing
  byte for byte when it is present. It also pins that an unreadable verdict
  record at the reference makes the line decline to appear rather than be
  measured against an empty one, which would quietly disable the check that
  notices a change deleting verdicts."
aspects: []
relations: [ { target: cli/tests/support, type: uses } ]
