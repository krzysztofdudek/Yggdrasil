name: Repo-Wide Regression Guards
type: test-suite
description: "Repo-wide meta-tests (in-process, no spawned binary) that guard today's cleanup against silent rot. One greps the source-of-truth files (CLI source + templates, docs, examples, tools, top-level READMEs, config schemas) and fails if a removed CLI command name reappears as a runnable command. The other re-asserts the false-green invariant over this repo's own dogfood graph: every covered, readable, git-tracked file is in at least one expected verification pair OR legitimately accounted for (no rule applies, binary excluded from an LLM-only subject set, or scope-excluded), so no mapped file silently leaves the review set and passes a rule vacuously. A third holds the family-contracts register to the code both ways: every schema constant declared under src/formatters/ appears on docs/family-contracts.md, and every schema id on that page is either such a constant or a whitelisted document produced elsewhere — so neither a new machine document nor a retired one can leave the page saying something a consumer in another repository would believe. A fourth fails when an adopter-facing surface (the docs site, the READMEs, the templates the CLI prints, the examples) describes a removed feature, such as the port contract baseline, as if it still existed. A fifth holds one word to one meaning: it fails when a retired synonym the Glossary lists as not used (LLM aspect, judgment rule, enforcement level, drill into for a check view, and the like) comes back in adopter-facing prose or in a non-comment line of CLI source. A sixth evaluates the portal glossary module in a sandbox and fails when docs/glossary.md is not exactly the page rendered from its entries, when an entry's docs link or anchor does not exist, or when the Glossary page leaves the Start here group of the docs sidebar. Two more hold the graph's self-governance to the files it claims: every rule script this graph defines, at any nesting depth, is owned by the rule-script node and no drill fixture is; no tracked file matches the when of two architecture types; no description still names a review channel that has been removed, and no enforced rule says it never blocks. The rules that need graph context a single-file drill cannot give (sibling-test-file, the portal count-parity rule) are driven here with a hand-built context over their real rule scripts. One more is a ratchet on how end-to-end tests assert: it counts, per end-to-end file, the assertions that pin a sentence of CLI prose, and fails when a file holds more than its committed baseline (so a new test asserts on codes and JSON fields) or fewer (so a conversion lowers the baseline and the count only goes down). Files whose subject is the wording itself, the golden corpus and the docs samples, are not counted. The last renders the issue-code tables of the docs CLI reference and of the knowledge cli-reference topic from the code registry and fails on any difference, so neither can list a code the CLI does not register or miss one it does; it also fails when any Code-headed table of the docs or the knowledge topics names an unregistered code. One holds the @chrisdudek/runes pin together: the exact version package.json names is the one the lock records, node_modules holds and the code loads, the lock fetches it only from the npm registry or (while a release branch pins a Runes version not yet on npm) the GitHub archive of a Runes commit, publishing refuses the latter, and the built CLI imports Runes instead of bundling it (scripts/runes-pin.mjs). The guards that compare a generated file with its source (the glossary page, the issue-code tables, the prose baseline, and in the file-formats child the docs field tables and the published JSON Schemas) only read: each renders what the file should hold through a shared module beside it, and the one place those files are written is generated-files.update.ts, a developer command that Vitest runs only under vitest.update.config.ts, one step per npm script (glossary:update, codes:update, schemas:update, json-schemas:update, prose:baseline), never under npm test. One more renders the knowledge cli-reference topic from docs/cli-reference.md (tests/support/cli-reference-knowledge.ts) and fails when the committed module differs or the topic is anything but that text around the registry's issue-code tables, so the topic an agent reads cannot say what the docs page does not; npm run cli-reference:update rewrites it. Another reads every string the shipped source spells (string literals and templates through the TypeScript parser, a substitution as one unknown word, a count() as a number and its noun) and fails when a message the docs pages, the knowledge topics, the operating manual or the unreleased CHANGELOG quote as output has three words in a row the CLI cannot print, so a quote copied from an older build cannot stay on a page after the words changed. One holds the register of invariants the docs sell (a package the marketplace check passes installs, --approve refuses over a conflicted log, the free runs leave committed files alone, and the others the 2026-09-25 surface audit listed): each claim's sentence must still be on its page, and each of its tests must exist and cite that sentence in a Claim comment directly above it. The wording policy reads every sentence of the docs pages, the README, the knowledge topics, the agent manual and the schema references that makes an absolute claim about an effect of the CLI (writes nothing, never calls, never blocks, nothing at all, zero by design) and fails unless a claim test in the register backs it or a review records why it holds at every edge; a review that names no sentence any more fails as stale. Another fails when a fenced block in an examples README shows the check report layout retired in 6.1.0 (Errors (N) sections, indented Fix lines, a capitalised Next line, a header counting aspects and flows), so the pasted reports cannot drift back to it. The family guard runs the import, spawn and state-path guard from @chrisdudek/runes/testkit over the CLI source, with Yggdrasil declaring no edge to another family tool, and fails when any string literal or template text names another family tool, since a message about another tool ages with that tool."
