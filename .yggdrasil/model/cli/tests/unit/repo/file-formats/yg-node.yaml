name: File-Format Guards
type: test-suite
description: "Guards that hold every surface describing a file format to the one schema object it is derived from. The file-format conformance test writes a full valid document of each of the ten YAML formats, parses it with the real parser, then for every field the schema declares writes a value of the wrong type — and for every closed block an unknown key — and requires the real parser to refuse it, so a schema cannot promise a check the parser does not make. The field-table test renders each format's table into the docs pages between their markers and fails on any difference. The YAML-examples test parses every yaml block of the docs and the knowledge topics that shows a graph, configuration or package file through that file's real parser, completing an excerpt with what its format requires and skipping grammar sketches."
aspects: []
relations:
  - target: cli/file-formats
    type: uses
  - target: cli/io/parsers/graph
    type: uses
  - target: cli/io/parsers/aspect
    type: uses
  - target: cli/io/parsers/config
    type: uses
  - target: cli/io/parsers/packages
    type: uses
  - target: cli/knowledge-concepts
    type: uses
mapping:
  - source/cli/tests/unit/repo/file-format-conformance.test.ts
  - source/cli/tests/unit/repo/file-schema-tables.test.ts
  - source/cli/tests/unit/repo/yaml-examples-parse.test.ts
