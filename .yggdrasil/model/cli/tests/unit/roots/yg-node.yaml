name: Roots Unit Tests
type: test-suite
description: "Unit tests for the roots convention-mining module: the roots
  config seam (parseConfig's roots: block plus rootsConfigHash), the roots
  store (model.json header/body I/O, seeds.jsonl, per-store-file hashing), the
  dormancy pin proving a project with no roots: block gets zero runtime
  change from this module's presence, the deterministic-history proof for the
  golden-repository git-fixture extension (including an absolute pin of every
  commit's author/committer date against the function under test, not just a
  same-run self-comparison), a round-trip proof for the golden-bundle builder
  and equivalence checker themselves (a fresh spec/bundle pair passes; a
  spec mutated after the bundle was cut throws the specific HEAD-sha drift
  diagnostic), a spawned-eslint proof that the roots genericity
  import/extension-literal/type-only-import fence actually fires (rather than
  silently scoping to nothing, the failure mode this repo has hit once before
  with a different lint rule), and binding derivation (deriveBinding pinned
  against 16 committed per-grammar snapshots, the node-types.json disk
  loader's happy and loud-failure paths, a build assertion that every
  registry-shipped grammar resolves a readable node-types.json, and the
  lexical decoration-marker/attribution-window helpers table-driven across
  the six measured grammars' decorator kinds), and extraction/enumeration
  (extract.test.ts: scope discovery, ordinals, qualifiedName/stable_id
  identity, the decoration marker/window regressions applied at extraction
  level, §6.1 error tolerance, §6.7 no-descend and the visit cap, module-scope
  synthesis; partitions.test.ts: package-root detection, the 300-scope floor,
  the _repo merge, J4, and the two-flavor exclusion factory; enumerate.test.ts:
  one table-driven case per applicable Appendix B enumerator against real
  parsed TypeScript, vocabulary support/top-K selection, the grammar-declared
  node-type-vocabulary E3 domain (verified against a mixed TypeScript/Python
  fixture, where a TS-only construct is out of domain for every Python
  scope), the spec §5 sparse-vs-dense counting property test exercised over
  every bool surface a mixed-grammar fixture produces, and the §7.3
  overlap-group map; and role induction (roles.test.ts: the §8.1 feature
  bag incl. casing-boundary tokenization and the 5-distinct-import cap, §8.2
  Jaccard, §8.3's per-partition bucket-weighted clustering with an
  independently-verified incremental-DL MDL cut and a live mutation
  round-trip on the cut-improvement comparison, §8.4/8.5's nearest-medoid
  classifier with a live mutation round-trip on the clone-aware runner-up
  skip, a weighted-medoid tie-break round-trip, §8.6's assignments-map
  persistence (the #k ordinal and the '-1' ambiguity marker), §8.8's role
  identity (role_key/label/definingFeatureGroups, each group fresh
  end-to-end incl. decorator and import-segments), a live mutation
  round-trip on per-partition isolation and on the minClusterSize floor,
  §8.9(b)'s file-role plurality incl. a lexicographic tie-break round-trip
  and w_base weighting, and §8.10's role_lift pure function incl. a live
  mutation round-trip on the overlap-group held-out exclusion and a
  decorative-role (role_lift <= 0) case; roles-ambiguous.test.ts, a sibling
  kept separate purely for reviewer-prompt headroom: the REWORK-added
  `RoleAssignment.ambiguousRank1` companion map — an ambiguous scope's
  rank-1 roleKey survives alongside `assignments`' own `'-1'`, a confident
  scope carries no entry, a scope with no role at all carries no entry in
  either map, and a fully non-ambiguous induction leaves the map empty);
  and the MDL acceptance chain
  (mine.test.ts: the Appendix E worked scenarios E.2 fire-ability, E.3
  role-acceptance S1-S5, and E.4 index-cost pinned directly against
  `scoreCandidate`/`indexCostBits`/`isFireable`; full `mine()` runs over
  hand-built fixtures proving acceptance and hook eligibility are separate
  stages, the fail-closed survived-raw default and its AgeFn flip, the §7.3
  tautology skip's placement, decorative
  demotion, the §9.4d vacuous filter, §9.4e dedup, the §9.4h factCap, config
  threading, and Appendix-D shape conformance incl. `roles[]` carrying no
  `partitionId`; mine-invariants.test.ts, a sibling kept separate purely for
  reviewer-prompt headroom: the REWORK fixes — a multi-kind categorical
  alphabet unions rather than last-kind-overwrites (H1), deviantsN as the
  RAW non-conforming population per Appendix D's own worked record rather
  than nTotalRaw-nConformRaw (H2), the boolean candidate universe derived
  from DOMAIN intersection rather than observed-true bag keys plus the
  §9.4d vacuous filter's partition-wide (not kind-scoped) true-raw
  population (H3, incl. the reviewer's cross-kind Probe-C), ambiguous role
  members joining their rank-1 role's cell at half weight with role_lift's
  n_eff(r) summing ALL rank-1 members at full weight via `ambiguousRank1`
  (AMB), a Map+Object.fromEntries counts serialization surviving a
  '__proto__'-named value (L1), an Object.hasOwn guard on a seed-supplied
  surface name (L2), moduleOfFile derived from finalizeUnits' own minted
  module units (L3), plus dedicated mutation-kill tests for the acceptance
  conjuncts, C's exact candidate count, factCap ranking, dedup's per-cell
  scoping, directory-context creation boundaries, each hook-eligibility
  gate, the seed cap, and canonical-decimal/fire-ability/tau-tier/
  freshPenaltyDays boundaries; pipeline.test.ts: `parseAndExtractAll`'s §6.1
  oversize
  exclusion and malformed-file tolerance over a real tmp-dir mini-repo, the
  per-grammar-per-process binding cache, a full `runRootsIndex` double-run
  proving header-excluded byte-shape stability, the forParsing mining-only
  test-pattern exclusion surviving the marker-scan listing, and
  bindingSetHash's insertion-order independence;
  pipeline-binding-set.test.ts: the sibling pin that bindingSetHash folds
  only the current run's used grammars — indexing the same repository again
  after another grammar warmed the process-lifetime binding cache hashes
  identically, and different grammar sets never share a hash); and Task 7's proof
  harness — the seven committed golden repositories (spec §20.2/design
  §13.2: builder spec + `git bundle` pairs under tests/fixtures/roots/golden/,
  each with its own builder<->bundle equivalence check) plus the
  increment-wide controls, spread across five sibling files purely for
  reviewer-prompt headroom: golden.test.ts (the typescript golden, carrying
  the alphabets-union regression guard for BOTH kinds' `auto.nameshape`, an
  exactly hand-counted `candidateCountLog2` pin, a live forParsing
  round-trip proving the mining-only test-pattern exclusion is not a
  vacuous negative, and a real, hand-derived `deviantsN`); golden-more.test.ts
  (tsx/javascript/java/go — MUST-mine/MUST-NOT-mine per golden, §9.4e dedup
  observed directly on java/go's own lead facts); golden-python.test.ts (the
  deliberately role-rich python golden: real role-conditioned MUST-mine
  facts a partition-average baseline stays silent on); golden-data.test.ts
  (design §5.4's data+code mix: MUST-mine on file/module surfaces,
  MUST-NOT-mine — structurally, not statistically — on every scope-level
  enumerator over the json/yaml/toml files); and golden-controls.test.ts
  (the null control: a deterministic seeded per-surface within-domain
  shuffle on the role-rich python golden destroys every role-conditioned
  fact; the fail-closed control's two halves — every golden's real
  `runRootsIndex` output shows zero `hookEligible` facts, and a hand-built
  unit-level fixture proves a synthetic AgeFn flips it true without moving
  acceptance; and the determinism control — double `runRootsIndex` yields a
  byte-identical `MinedModel`). Scope boundary stated in golden.test.ts's
  own header: the six prototype-measured grammars plus data are R1-R3's;
  the remaining seven code-grammar goldens and the mutation harness are
  R10's."
