name: Prompt Headroom Unit Tests
type: test-suite
description: >-
  Unit tests for pure/testable pieces of the prompt-headroom measurement
  script (scripts/prompt-headroom.mjs). resolveTierLimits: given the raw text
  of a committed yg-config.yaml, resolves every declared reviewer tier's real
  max_prompt_chars ceiling using the CLI's own YAML parser — never fooled by a
  larger number sitting in a comment, indifferent to which sibling key
  precedes `tiers:` — or throws when it cannot establish one (unparseable
  YAML, a missing or empty reviewer.tiers, a non-positive-integer ceiling),
  rather than let a caller print a margin against a ceiling it never actually
  established; its own copy of the engine's default ceiling is asserted
  against the real `DEFAULT_MAX_PROMPT_CHARS` import from llm/prompt.ts, not
  against itself. buildOverrideSecretsText: deep-merges the script's temporary
  1-char measurement ceiling INTO whatever the maintainer's own gitignored
  yg-secrets.yaml overlay already held, rather than replace the file wholesale
  — so their provider/endpoint/model survive alongside the override.
  installInterruptRestore: registers a handler for every one of SIGINT,
  SIGTERM, SIGHUP, and SIGQUIT that calls the script's restore function and
  exits with the conventional 128+signal code — `process.on('exit', ...)`
  alone never fires for any of them. parsePromptTooLargeEntries: parses the
  engine's "assembled prompt" sentence AND cross-checks the result against a
  second, wording-independent count of the same fact (how many issues in the
  same output carry the stable `prompt-too-large` code), throwing on
  disagreement rather than silently under-reporting when that sentence's
  wording changes. countDeclaredLlmAspects and classifyZeroMeasurement
  together decide whether a zero-pairs-measured result is a genuinely
  LLM-aspect-free graph or a broken measurement. All exercised directly and
  offline (no subprocess, no built dist); the remaining necessary half of the
  interruption fix — that the restore handlers actually get a chance to run
  DURING a multi-second child `yg check` wait, which requires the async
  `execFile` this script now uses instead of a blocking `execFileSync` — was
  verified by manually sending a real SIGINT to a running instance against a
  scratch copy, not by an automated test (a real, timing-dependent OS signal
  delivered mid-wait is not a reliable thing to assert on in CI).
aspects: []
relations:
  - target: scripts
    type: uses
  - target: cli/llm/shared
    type: uses
mapping:
  - source/cli/tests/unit/prompt-headroom.test.ts
