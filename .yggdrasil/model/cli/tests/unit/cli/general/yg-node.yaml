name: CLI Build & Check Command Tests
type: test-suite
description: "Unit tests for build and check CLI commands — build-command,
  build-context, check, the check render layer split across
  check-render-header/check-render-groups/check-render-views, check-exit (the
  command-exit force-exit path), init, init/upgrade, the shared
  exit-after-flush command-exit helper, and the rules-artifacts reader that
  feeds the committed-digest gate — which must see exactly what the installer
  wrote, including a repo whose agent-rules file carries a non-canonical
  capitalization. It also covers the worker-thread ceiling the check injects
  into the free deterministic fill: sized from cores AND the machine's memory,
  because every worker carries its own copy of the graph and its own parsed
  trees, and sizing on cores alone let a large machine multiply the two until a
  large repository could not rebuild its deterministic verdicts at all. It also
  covers the progressive-preflight state machine — the pure decision table that
  turns the progressive-mode git probes into a gate-everything/gate-only-the-
  touched-set/stay-quiet/fall-back verdict, including the rule that every
  fall-back names both its own cause and its own remedy; the one collapsing
  decision in the change-scope resolver built on it; and how a finding the
  change is not accountable for is labelled, derived from the label of the
  finding it mirrors so no such finding can render as a raw internal code. It
  also carries a cost-invariant (call-count) suite pinning how many times
  `yg context --file` classifies the type-level lattice and enumerates the
  whole-graph pair set per invocation, by spying on the real classification
  and enumeration entry points rather than re-deriving the counts by hand."
aspects: []
max_direct_relations:
  limit: 32
  reason: >-
    Growth is honest, not accidental: this node is a shared test-suite umbrella
    covering an entire command's test files (build, check, and now the
    check-render-header/-groups/-views split, plus init and its shared
    helpers, plus the progressive-preflight state machine, the change-scope
    resolver, the outside-changes labels, which are asserted against the
    engine's own code sets rather than a re-spelled copy of them, and the
    classify/enumerate-once cost-invariant suite, which spies on
    cli/core/type-coverage's own classification entry point and builds a real
    seeded classification through cli/io/file-content-cache's store), so its
    relation count tracks the real dependency surface of everything it tests.
    The ceiling sits exactly at the current count (32): every widening of this
    umbrella's reach is a deliberate declaration, never silent headroom.
