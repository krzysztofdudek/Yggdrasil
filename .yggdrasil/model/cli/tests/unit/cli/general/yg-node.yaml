    { target: cli/formatters, type: uses },
    { target: cli/exit-after-flush, type: uses },
    { target: cli/io/stores, type: uses },
    { target: cli/core/check, type: uses },
    { target: cli/templates, type: uses },
    { target: cli/templates-platform, type: uses },
    { target: cli/core/checks/digest-gate, type: uses },
    { target: cli/rules-artifacts, type: uses },
    { target: cli/utils, type: uses }
  ]
