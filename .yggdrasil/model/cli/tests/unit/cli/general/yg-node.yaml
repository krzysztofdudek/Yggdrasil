name: CLI Build & Check Command Tests
type: test-suite
description: Unit tests for build and check CLI commands — build-command,
  build-context, check, check-render, check-exit (the command-exit force-exit
  path), init, init/upgrade, the shared exit-after-flush command-exit helper,
  and the rules-artifacts reader that feeds the committed-digest gate — which
  must see exactly what the installer wrote, including a repo whose agent-rules
  file carries a non-canonical capitalization.
aspects: []
relations:
  [
    { target: cli/commands/build-context, type: uses },
    { target: cli/commands/check, type: uses },
    { target: cli/group-issues, type: uses },
