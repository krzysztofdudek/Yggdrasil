name: CLI Output Layer Tests
type: test-suite
description: "Unit tests for the CLI's output layer and for the words of the fill stage. For the output layer: that a count and its noun always agree (zero included); that a capped list announces what it hid, with the drill command when one is given; that the three-part block keeps a multi-line what whole; the verdict and Next line shapes; that a fix keeps a heading-introduced list whole; that the code registry labels the refusal and coverage codes as a report does, puts every graph-invalid code in the first tier and cannot land on an inherited Object.prototype key; that a fix is recorded as a runnable command only when its first line is one, whole; and the command-error path — the Error: block on stderr, nothing on stdout unless the invocation answers in JSON, and then exactly the yg-error/1 document. For the fill words: what each fill event reads as — the dispatch header with its skipped-paid-work line, a pair's outcome, the periodic tally, the nothing-finished line, the in-place status line cleared and cut to the width with one column spare, a closing line that claims every pair valid only when nothing was filled or skipped, the cost preview and the prune summary.

  And the report's communication fixes, rendered from constructed findings: a member list capped at twelve rows by the view in every sink (not only on a terminal) and ended with the command that shows the rest, --top capped the same way, the drill-in view showing everything and --summary bounded to the busiest rows; per-file pairs of one rule on one node collapsed into one row that counts the files, a single one naming its file, and no member line repeated; every line of a finding's what rendered in the grouped and per-issue views and every line of a coverage fix; a configuration, architecture or component file that did not load leading the report under a partial-result banner with Next naming its fix; the gate abort as a report under an ABORTED verdict line with one templated fix for its nodes and the re-run keeping the user's flags, and as a yg-check/1 document with exit status aborted; counts agreeing with their nouns and the fill command naming what it costs; and the document's structured fields beside the prose — label, unit, violations, edges, files, groups and banner."
aspects: []
relations:
