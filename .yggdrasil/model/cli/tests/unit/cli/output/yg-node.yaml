name: CLI Output Layer Tests
type: test-suite
description: "Unit tests for the CLI's output layer and for the words of the fill stage. For the output layer: that a count and its noun always agree (zero included); that a capped list announces what it hid, with the drill command when one is given; that a command error, a note and a warning render in the one grammar (`error[code]: what`, a labelled why, a `next:` step, a leading `Run:` dropped) with the code inferred when the caller names none; the verdict, next and then line shapes; that a fix keeps a heading-introduced list whole; that the code registry labels the refusal and coverage codes as a report does, puts every graph-invalid code in the first tier and cannot land on an inherited Object.prototype key; that a fix is recorded as a runnable command only when its first line is one, whole; and the command-error path — the error block on stderr, nothing on stdout unless the invocation answers in JSON, and then exactly the yg-error/1 document. For the help: the root help grouped by task with one line per command, a command's help with its one line, one option style, examples and an About paragraph, and every error the argument parser raises reported as a usage error naming the command's help, with the yg-error/1 document for a JSON invocation. For the fill words: what each fill event reads as — the dispatch header with its skipped-paid-work line, a pair's outcome, the periodic tally, the nothing-finished line, the in-place status line cleared and cut to the width with one column spare, a closing line that claims every pair valid only when nothing was filled or skipped, the cost preview and the prune summary.

  And the report's communication fixes, rendered from constructed findings: a member list capped at twelve rows by the view in every sink (not only on a terminal) and ended with the command that shows the rest, --top capped the same way, the drill-in view showing everything and --summary bounded to the busiest rows; per-file pairs of one rule on one node collapsed into one row that counts the files, a single one naming its file, and no member line repeated; every line of a finding's what rendered in the grouped and per-issue views and every line of a coverage fix; a configuration, architecture or component file that did not load leading the report under a partial-result banner with Next naming its fix; the gate abort as a report under an ABORTED verdict line with one templated fix for its nodes and the re-run keeping the user's flags, and as a yg-check/1 document with exit status aborted; counts agreeing with their nouns and the fill command naming what it costs; and the document's structured fields beside the prose — label, unit, violations, edges, files, groups and banner.

  And the guards that keep the communication system from regressing: that writeOut and writeErr are the streams and paint the colour, and count and plural are the utility the engine uses; that no rendered block repeats a member line — a finding reported twice, a pair surfaced twice, a node owing a log entry twice, across the full and details views, and every block of the golden output corpus — with the parser shown to see a planted repeat; and that no what, why or next in the shipped source lays itself out, a newline followed by indentation or an indented line joined in beside one, found by a TypeScript-AST scan shown to catch planted messages and to pass a separator that merely opens with a space."
