name: CLI Inspection Command Tests
type: test-suite
description: >-
  Unit tests for inspection and aspect-test CLI commands — knowledge,
  aspect-test, tree, type-suggest, suppressions, and prime (plus the shared
  cli-version resolver prime uses to stamp its output), and the registration
  contract of both halves of the drill command — running a rule's corpus, and
  taking a case into it.
