name: CLI Inspection Command Tests
type: test-suite
description: >-
  Unit tests for inspection and aspect-test CLI commands — knowledge,
  aspect-test, tree, type-suggest, suppressions, and prime (plus the shared
  cli-version resolver prime uses to stamp its output), and the registration
  contract of both halves of the drill command — running a rule's corpus, and
  taking a case into it.
aspects: []
max_direct_relations:
  limit: 22
  reason: >-
    Set at the reviewed count of 21 when type-only imports became dependencies in 6.1.0:
    the suite already named the graph model's types, and that import is now a declared
    relation, taking it one over the project default. Raised to 22 when the suppression
    scan moved out of the portal facade into the engine: the suite reads the scan and its
    eligibility rule from the engine now, and the portal's own marker adapter still from
    the facade, so both edges stand.
relations:
  [
    { target: cli/core/suppressions, type: uses },
    { target: cli/ast/runtime, type: uses },
    { target: cli/commands/aspect-test, type: uses },
    { target: cli/commands/drill, type: uses },
    { target: cli/commands/knowledge, type: uses },
    { target: cli/commands/schemas, type: uses },
    { target: cli/commands/suppressions, type: uses },
    { target: cli/commands/tree, type: uses },
    { target: cli/commands/portal, type: uses },
    { target: cli/portal/engine-api, type: uses },
    { target: cli/commands/type-suggest, type: uses },
    { target: cli/core/pairs, type: uses },
    { target: cli/llm/shared, type: uses },
    { target: cli/llm/registry, type: uses },
    { target: cli/preamble, type: uses },
    { target: cli/structure, type: uses },
    { target: cli/commands/structure, type: uses },
    { target: cli/io/stores, type: uses },
    { target: cli/commands/prime, type: uses },
    { target: cli/cli-version, type: uses },
    { target: cli/templates, type: uses },
    { target: cli/model/graph, type: uses }
  ]
mapping:
  - source/cli/tests/unit/cli/knowledge.test.ts
  - source/cli/tests/unit/cli/schemas.test.ts
  - source/cli/tests/unit/cli/aspect-test.test.ts
  - source/cli/tests/unit/cli/drill.test.ts
  - source/cli/tests/unit/cli/drill-add.test.ts
  - source/cli/tests/unit/cli/tree.test.ts
  - source/cli/tests/unit/cli/portal.test.ts
  - source/cli/tests/unit/cli/type-suggest.test.ts
  - source/cli/tests/unit/cli/suppressions.test.ts
  - source/cli/tests/unit/cli/suppressions-disk-scan.test.ts
  - source/cli/tests/unit/cli/suppress-file-level.test.ts
  - source/cli/tests/unit/cli/structure.test.ts
  - source/cli/tests/unit/cli/prime.test.ts
  - source/cli/tests/unit/cli/cli-version.test.ts
