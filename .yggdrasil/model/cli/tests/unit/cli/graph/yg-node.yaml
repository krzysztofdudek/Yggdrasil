name: CLI Graph Query Command Tests
type: test-suite
description: >-
  Unit tests for graph-query commands — aspects (with its rule log), find,
  flows, impact, node, and owner (whose file-to-node lookup the which tests
  exercise). The node tests cover the component document both views are built
  from: the structure of a component with children and a parent, the ports it
  publishes, and the refusal a path naming no component gets. The machine
  documents both the impact and the node views are assembled from are covered
  directly against in-memory graphs: which dependents are direct and which are
  reached through somebody else, the path each indirect one travels, who
  consumes a published port — including through an event relation, which the
  dependency algorithms deliberately ignore — and a port's DECLARED contract
  version rather than the one a versionless port is read at.
aspects: []
max_direct_relations:
  limit: 21
  reason: >-
    Set at the reviewed count of 21 when type-only imports became dependencies in 6.1.0:
    the suite already named types of the graph model, the lock verifier, the rule-health
    signals and the portal engine facade, and those imports are now declared relations,
    taking it one over the project default. No new behaviour is tested through them.
relations:
  [
    { target: cli/commands/aspects, type: uses },
    { target: cli/commands/find, type: uses },
    { target: cli/commands/flows, type: uses },
    { target: cli/commands/node, type: uses },
    { target: cli/commands/owner, type: uses },
    { target: cli/impact-handlers, type: uses },
    { target: cli/model/lock, type: uses },
    { target: cli/preamble, type: uses },
    { target: cli/core/loader, type: uses },
    { target: cli/core/graph, type: uses },
    { target: cli/core/context, type: uses },
    { target: cli/core/pairs, type: uses },
    { target: cli/core/review-package, type: uses },
    { target: cli/formatters, type: uses },
    { target: cli/io/lock-store, type: uses },
    { target: cli/tests/fixtures, type: uses },
    { target: cli/tests/support, type: uses },
    { target: cli/core/aspect-health-signals, type: uses },
    { target: cli/core/verify-lock, type: uses },
    { target: cli/model/graph, type: uses },
    { target: cli/portal/engine-api, type: uses }
  ]
mapping:
  - source/cli/tests/unit/cli/aspects.test.ts
  - source/cli/tests/unit/cli/aspects-log.test.ts
  - source/cli/tests/unit/cli/find.test.ts
  - source/cli/tests/unit/cli/flows.test.ts
  - source/cli/tests/unit/cli/impact.test.ts
  - source/cli/tests/unit/cli/node.test.ts
  - source/cli/tests/unit/cli/machine-documents.test.ts
  - source/cli/tests/unit/cli/owner.test.ts
  - source/cli/tests/unit/cli/which.test.ts
