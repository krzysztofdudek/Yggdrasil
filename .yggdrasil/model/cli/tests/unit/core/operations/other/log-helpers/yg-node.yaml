name: Log Format and Integrity Helper Unit Tests
type: test-suite
description: "Unit tests for log helper functions — log entry format parsing,
  integrity-hash verification, and lock-backed merge resolution. It also covers
  a rule's own history: the log written beside the rule and nowhere else (a
  symlinked or hard-linked file is refused before anything is written, a rule
  nobody has said anything about reads as no entries, and a log whose entry
  boundary is broken is refused rather than half-read), and a rule's standing as
  part of that history — a change made by hand is noticed once and written down
  once, decided by reading the rule's own log so the recording run and the
  reporting run agree days apart; a rule this checkout has never seen is
  remembered silently because there is no change to narrate; and a log that
  cannot be written never advances the memory, which would leave the change
  neither recorded nor ever noticeable again. And the reader of a node type's
  decisions: the decisions in force for a type and for the types above it on
  its parent chain, nearest first, with a replaced decision left out, a type
  with nothing in force skipped and a log that does not parse reported as
  unreadable. And the type log below the CLI: the refusals of an add, the
  baseline it records in the lock's types section and that section refused when
  malformed, the check findings over it including an orphaned log, a merge of
  it reconciled, the standing of replaced entries, and a recording run dropping
  the baseline of a type that is gone. And law on a node type below the CLI:
  which types a rule reaches and at what status (an attachment raising it, an
  implied rule reaching the type, a draft implier implying nothing), a rule
  version that ignores status and follows what the rule demands, the
  ratification sentence written and read back, the finding and its severity
  under the setting, an admission of an earlier version named and a retracted
  one not counted, an unreadable log said, and the law a graph already had
  recorded once, with a log that refuses the entry reported."
