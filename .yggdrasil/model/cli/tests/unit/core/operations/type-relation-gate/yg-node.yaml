name: Type Relation Gate Unit Tests
type: test-suite
description: "Fixture-driven integration tests for the live type-to-type relation
  gate (coverage.type_level's import-edge check), via runCheck on the dedicated
  type-relation-gate/ fixture: the deny-default forbidden edge, an explicit
  allow-list entry, a vacuous allow from a source type with no relations table
  at all, an edge into a deliberately ambiguous file that must never be gated,
  the flag-off no-op, the read-cost invariant (a type-covered-only file is
  never parsed at flag-off, and a nested graph subtree is excluded from the
  gate's enumeration even at flag-on), and a direct test of the runRelationPass
  typedEdges field against the same fixture (assembling the same deps
  core/check.ts's earlyTypeCoverage wiring does: computeTypeCoverage over
  scanUncoveredFiles's output)."
aspects: []
relations:
  [
    { target: cli/core/loader, type: uses },
    { target: cli/core/check, type: uses },
    { target: cli/io/stores, type: uses },
    { target: cli/core/type-coverage, type: uses },
    { target: cli/io/file-content-cache, type: uses },
    { target: cli/relations/core, type: uses },
    { target: cli/relations/extractors, type: uses }
  ]
mapping:
  - source/cli/tests/unit/core/type-relation-gate.test.ts
