name: Pairs Unit Tests
type: test-suite
description: "Unit tests for expected-pair computation and source fingerprints —
  covers per-node and per-file pairs, scope.files path and content filters,
  binary exclusion for LLM aspects (deterministic aspects keep binaries),
  empty-subject vacuous pass, draft aspect inclusion/exclusion, aggregate aspect
  exclusion, child carve-out, deterministic output ordering, fingerprint
  stability/sensitivity properties, and (Task 6) the nodeless enumeration pass
  for files enforced by their architecture type alone — the PairDrop channel,
  the explicit-mapping-outranks-exclusion guard against the real
  type-level-engine fixture, and the K13 shared-record merge at the unit level."
