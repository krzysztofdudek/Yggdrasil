name: Fill Deterministic Unit Tests
type: test-suite
description: "Unit tests for deterministic fills — det-first ordering, det gate
  skipping LLM (pinned directly on detGateKey plus a real cross-file fill
  run), positive closure, log gate, GC, incremental writeLock,
  taint/re-run-once, per-file pair contract, the coalescing verdict writer
  (batched writes, recovery from a failed write, events after the write that
  carries them) and the one-approval-at-a-time lock, the append-only verdict-events
  telemetry sidecar, the same-process fill→check handoff that lets a
  component-free file's disposition reach that same run's own report, and the
  step that records an assembled prompt's size onto verdicts written before
  that field existed — the only thing that ever writes one onto a verdict that
  is already valid, and so the only reason a repository with nothing to fill
  ever reaches the fast path at all."
aspects: []
max_direct_relations:
  limit: 23
  reason: >-
    Set at the reviewed count of 23 when type-only imports became dependencies in 6.1.0:
    the suite already named the pair engine's, the fill-event model's and the validation
    model's types, and those imports are now declared relations, taking it three over
    the project default. No new behaviour is tested through them.
