name: Fill Deterministic Unit Tests
type: test-suite
description: "Unit tests for deterministic fills — det-first ordering, det gate
  skipping LLM (pinned directly on detGateKey plus a real cross-file fill
  run), positive closure, log gate, GC, incremental writeLock,
  taint/re-run-once, per-file pair contract, the append-only verdict-events
  telemetry sidecar, and the same-process fill→check handoff that lets a
  component-free file's disposition reach that same run's own report."
aspects: []
relations:
  [
    { target: cli/core/fill, type: uses },
    { target: cli/core/loader, type: uses },
    { target: cli/core/verify-lock, type: uses },
    { target: cli/formatters, type: uses },
    { target: cli/io/lock-store, type: uses },
    { target: cli/io/stores, type: uses },
    { target: cli/llm/shared, type: uses },
    { target: cli/llm/registry, type: uses },
    { target: cli/structure, type: uses },
    { target: cli/core/reviewer-tiers, type: uses },
    { target: cli/commands/init, type: uses },
    { target: cli/core/pair-hash, type: uses },
    { target: cli/core/pair-inputs, type: uses },
    { target: cli/core/type-coverage, type: uses },
    { target: cli/tests/fixtures, type: uses },
    { target: cli/core/check, type: uses },
    { target: cli/check-render-header, type: uses }
  ]
mapping:
