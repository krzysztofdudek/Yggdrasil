name: Progressive Scope Unit Tests
type: test-suite
description: "Unit tests for the progressive-mode burn-set engine —
  impliesClosure's unconditional structural walk over an aspect's `implies`
  edges (including cycle termination), buildReverseTargetIndex's target ->
  source-node reverse map over every relation kind,
  collectFlowParticipants's declared-node-plus-descendants set, and
  computeBurnSet's full burn table (one case per row: subject files, a deleted
  path resolved through a glob mapping, aspect + implies closure, the node row
  with descendants / ancestors / reverse relations, the log.md carve-out, flow
  participants, architecture and config escalation, ignored lock outputs,
  stored observations cross-checked against touchedReferencesFile, cold pairs
  failing closed, and the linear performance shape), plus the config-vocabulary
  comparison. All built against small hand-built in-memory graphs and
  hand-built pair lists (no fixture project, no mocking)."
aspects: []
relations:
  - target: cli/core/progressive-scope
    type: uses
  - target: cli/core/graph
    type: uses
mapping:
  - source/cli/tests/unit/core/progressive-scope.test.ts
