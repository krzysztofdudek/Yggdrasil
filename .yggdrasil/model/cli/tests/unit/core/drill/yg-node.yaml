name: Drill Runner Tests
type: test-suite
description: "Unit tests for the yg drill runner — corpus discovery (verdict-prefix
  decoding, extension-stripped labels, .md/yg-aspect.yaml exclusion, --case glob,
  --dir holdout), outcome classification and exit-code logic, caseHash stability,
  and the runDrills orchestration over injected impure ops: deterministic pass /
  MISS / FALSE-ALARM / unsupported, and the LLM path (budget before first review,
  companion → unsupported, prompt-too-large → unrun, provider infra → unrun).
  Also covers the nodeless run context: with it unset, an assembled prompt still
  carries the pre-existing synthetic node; with it set, the assembled prompt is
  asserted BYTE-IDENTICAL to calling the production prompt builder directly with
  an equivalent nodeless input (no owning component) — proving the drill
  instrument can reproduce the same prompt shape a real component-less pair
  receives, not just an approximation of it. Beside the runner it covers how a
  real escape becomes a case: the file-at-a-commit spec and everything it
  refuses, the case name that carries its own origin (the file, the day the code
  existed and the commit), the byte equality that keeps the same code from
  entering the corpus twice under a second name, and the entry the rule's own
  history records — including that it says no reason was given rather than
  inventing one."
