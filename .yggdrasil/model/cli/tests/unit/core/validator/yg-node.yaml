name: Core Validator Pipeline Tests
type: test-suite
description: Unit tests for the core validator pipeline — the main validator
  suite (scope handling, dangling/duplicate aspect refs, mapping overlaps,
  relations, flows, schemas), structural-aspect validation, the
  review-cadence overdue linter, the two dead-attach linters' real-fixture
