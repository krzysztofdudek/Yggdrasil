name: Path and IO Utils Unit Tests
type: test-suite
description: "Unit tests for filesystem and path utility modules: atomic writes,
  cross-platform binary-availability probing, debug logging, node-path
  validation, path helpers, mapping-path normalization and glob matching, the
  mapping index's equivalence with a linear match, and check.mjs export-shape
  validation, and the (fromType, toType) allowed-relation-types lookup with a
  compat-identity check against its re-export from the relations pass, and the
  observation contract's byte-identity with its pre-move implementation over
  this repository's own graph"
aspects: []
relations:
  [
    { target: cli/io/atomic-write, type: uses },
    { target: cli/core/pair-hash, type: uses },
    { target: cli/io/stores, type: uses },
    { target: cli/io/parsers/graph, type: uses },
    { target: cli/model/graph, type: uses },
    { target: cli/relations/core, type: uses },
    { target: cli/structure, type: uses },
    { target: cli/utils, type: uses }
  ]
mapping:
  - source/cli/tests/unit/utils/atomic-write.test.ts
  - source/cli/tests/unit/utils/binary-check.test.ts
  - source/cli/tests/unit/utils/terminal-safe.test.ts
  - source/cli/tests/unit/utils/redact.test.ts
  - source/cli/tests/unit/utils/debug-log.test.ts
  - source/cli/tests/unit/utils/mapping-path.test.ts
  - source/cli/tests/unit/utils/mapping-path-glob.test.ts
  - source/cli/tests/unit/utils/mapping-index.test.ts
  - source/cli/tests/unit/utils/node-path-validator.test.ts
  - source/cli/tests/unit/utils/paths.test.ts
  - source/cli/tests/unit/utils/validate-check-module.test.ts
  - source/cli/tests/unit/utils/known-keys.test.ts
  - source/cli/tests/unit/utils/repo-path-escape.test.ts
  - source/cli/tests/unit/utils/allowed-relation-types.test.ts
  - source/cli/tests/unit/utils/observation-keys.test.ts
