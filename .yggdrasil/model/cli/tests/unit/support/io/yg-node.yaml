name: I/O Adapter Tests
type: test-suite
description: "Unit tests for I/O adapters that read/write runtime state —
  artifact-reader, find-index, secrets-parser, read-or-default,
  content hashing, the type-level classification cache, the append-only
  verdict-events telemetry sidecar, the instrument-import fence guard
  (feature-field reader/writer import boundary), and the
  rules-artifact-names single-source guard (installed-artifact-name
  literal boundary), and the sweep that clears a half-finished atomic write
  left behind by a process killed between writing its temp and renaming it.
  It also covers the two registers an import and a drill write through: the
  committed, union-merged register of proposals another tool handed this graph
  (a writer that does not swallow a failed write, and a reader tolerant of a
  line this build cannot understand), and a rule's case corpus on disk, whose
  directory layout is the reader's contract — only the two verdict-carrying
  prefixes are read back, a rule with no cases yet is an empty corpus rather
  than an error, and a case's exact bytes survive the round trip so the byte
  comparison a writer makes means what it says
  (config-parser and lock-store tests live in child nodes)"
aspects: []
relations:
  [
    { target: cli/ast/runtime, type: uses },
    { target: cli/core/loader, type: uses },
    { target: cli/io/parsers/config, type: uses },
    { target: cli/io/stores, type: uses },
    { target: cli/io/atomic-write, type: uses, consumes: [write-atomic] },
    { target: cli/tests/support, type: uses },
    { target: cli/core/check, type: uses },
    { target: cli/core/type-coverage, type: uses },
    { target: cli/io/file-content-cache, type: uses },
    { target: cli/core/type-classifier, type: uses },
    { target: cli/io/type-class-cache, type: uses },
    { target: cli/core/file-when-evaluator, type: uses }
  ]
mapping:
  - source/cli/tests/unit/io/advise-decisions-store.test.ts
  - source/cli/tests/unit/io/advise-imported-store.test.ts
  - source/cli/tests/unit/io/drill-corpus-store.test.ts
  - source/cli/tests/unit/io/artifact-reader.test.ts
  - source/cli/tests/unit/io/drill-results-reader.test.ts
  - source/cli/tests/unit/io/drill-results-store.test.ts
  - source/cli/tests/unit/io/events-reader-boundary.test.ts
  - source/cli/tests/unit/io/instrument-import-fence.test.ts
