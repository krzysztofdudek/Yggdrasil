name: Relations Unit Tests
type: test-suite
description: "Unit tests for the relation-conformance modules Yggdrasil keeps: the owner index, the extraction cache and its audit (including the Runes version in the cache key), the feature vector, agent-facing messages, the verifier, the index directory, and the live type-relation gate's pure decision function (computeTypeGateFindings). The extractors, symbol table, resolver and path resolvers are tested in @chrisdudek/runes, with the 460-case relation catalogue."
aspects: []
relations:
  - { target: cli/relations/core, type: uses }
  - { target: cli/io/parsers/graph, type: uses }
  - { target: cli/ast/runtime, type: uses }
  - { target: cli/core/loader, type: uses }
  - { target: cli/language-registry, type: uses }
  - { target: cli/tests/unit/helpers, type: uses }
  - { target: cli/utils, type: uses }
  - { target: cli/model/graph, type: uses }
mapping:
