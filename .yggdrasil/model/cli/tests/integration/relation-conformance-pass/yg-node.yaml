name: Integration Tests — Relation Conformance Pass
type: test-suite
description: "Integration tests for the parse-heavy relation-conformance pass
  and its wiring into yg check: edge resolution across nodes, the runCheck
  blocking-issue surface that emits relation-undeclared-dependency, the
  fill-stage approved-persistence path under yg check --approve, and the silent
  feature-field deviation index the reporting path maintains from the pass's
  per-file facts (byproduct-free at every other runCheck call site, best-effort,
  content-hash pinned to the pass's own hash)."
