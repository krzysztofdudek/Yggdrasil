name: Integration Structure Cross-Node and Concurrency Tests
type: test-suite
description: Integration tests for advanced structure-aspect drift scenarios — cold-start handling for never-approved or pre-feature baselines, parseCache sharing across a per:file rule's subjects (both the mapping-expansion cache and the AST parse cache a fill bucket shares), cross-node drift when a structure aspect reads files owned by another node, and file-list drift when a structure aspect decides from a node's file names alone (a file joining ctx.node.files or ctx.graph.node(x).files must invalidate the recorded verdict).
