name: Integration Tests — Fill Divergence Corpus
type: test-suite
description: "Ship-gate corpus test for the auto-approve convergence sentinel:
  drives the deterministic-only fill over a throwaway copy of every fixture that
  carries a .yggdrasil/ graph and asserts the sentinel fires zero times and never
  writes a .yg-fill-divergence.log. Any fire is a real convergence divergence the
  sentinel just caught, not a test bug. Also covers the evidence-log writer's
  fire path directly against an isolated temp root (self-ensured gitignore line,
  single rotation, fresh write) — mechanics the zero-fire corpus never exercises."
