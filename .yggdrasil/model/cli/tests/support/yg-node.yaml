name: Tests — Shared Git Fixtures & Goldens
type: test-suite
description: "Cross-tier test support: a git-fixture isolation helper used by unit,
  integration, and e2e suites that spawn throwaway `git init`/`add`/`commit`
  fixtures. It pins every fixture git command to the fixture's own repository with
  an explicit absolute GIT_DIR (disabling all repository discovery) and scrubs the
  inherited GIT_* discovery variables, so a fixture write can never touch the real
  repository's index — the isolation that keeps the pre-commit gate from ever
  capturing a partial staged set. It also carries an additive deterministic-history
  extension (pinned GIT_AUTHOR_DATE/GIT_COMMITTER_DATE from a fixed epoch, TZ=UTC,
  a pinned default branch) for scripted histories whose commit SHAs reproduce
  exactly across machines and runs.

  Built on that isolation, it also owns the builder for a minimal REAL Yggdrasil
  project inside such a repository: two components with one file each, one
  deterministic rule attached to both by their architecture type, and one file
  deliberately shipping a violation so that — once verdicts are recorded — the
  repository holds a pre-existing failure no later change touches. The initial
  commit lands on the reference branch and the builder can cut a branch off it
  and commit an edit, which is what lets a suite exercise anything that measures
  a change against a committed reference.

  A third file builds and verifies golden git repositories on top of the
  deterministic-history extension: a golden spec (an ordered commit list) replays
  into a real scripted repository, and an equivalence check proves a committed
  `git bundle` snapshot still matches what its spec produces — the mechanism a
  golden fixture needs because a working repository cannot itself be committed as
  a plain directory tree. A golden commit may also carry a day offset (scripting
  real time depth into a history via the same fixed-epoch commit-index grid,
  strictly ascending and guarded against dipping before any repository is
  created), a set of path renames (executed as `git mv` before that commit's own
  content changes), and a set of deletes.

  A fourth file builds the shared branch-and-merge fixture on the same
  primitives: a side branch cut before a mainline commit it is later merged
  past, so a full walk in build order delivers the side-branch commit ahead of
  that mainline commit despite its earlier date — reproducibly from scratch, or
  appended onto an already-built repository. All four files import only Node
  builtins; nothing from src/**."
aspects: []
