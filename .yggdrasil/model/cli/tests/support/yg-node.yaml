name: Tests — Shared Git Fixtures
type: test-suite
description: "Cross-tier test support: a git-fixture isolation helper used by unit,
  integration, and e2e suites that spawn throwaway `git init`/`add`/`commit`
  fixtures. It pins every fixture git command to the fixture's own repository with
  an explicit absolute GIT_DIR (disabling all repository discovery) and scrubs the
  inherited GIT_* discovery variables, so a fixture write can never touch the real
  repository's index — the isolation that keeps the pre-commit gate from ever
  capturing a partial staged set.

  Built on that isolation, it also owns the builder for a minimal REAL Yggdrasil
  project inside such a repository: two components with one file each, one
  deterministic rule attached to both by their architecture type, and one file
  deliberately shipping a violation so that — once verdicts are recorded — the
  repository holds a pre-existing failure no later change touches. The initial
  commit lands on the reference branch and the builder can cut a branch off it
  and commit an edit, which is what lets a suite exercise anything that measures
  a change against a committed reference. The rule can be attached as enforced
  or as advisory: an advisory one warns forever and is never re-coded by the
  change-scope classification, which is the only way to observe a finding that
  stands on untouched code while blocking nothing — the state a repository
  adopting a mined graph actually lives with. Both helpers import only Node
  builtins; nothing from src/**."
