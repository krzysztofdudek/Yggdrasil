version: "5.2.0"

quality:
  max_direct_relations: 10

# Enforcement targets the source tree. Only files under src/ must be mapped to
# a node; the README and graph metadata are not graph-covered code.
coverage:
  required: ["src"]
  excluded: ["/"]

# This example is KEYLESS: its only rule is a deterministic check.mjs, which
# runs locally at zero cost with no API key. The reviewer tier below is NOT
# required — a script-only project may omit the whole `reviewer:` section, and
# nothing asks for one until a judgment (LLM) rule is actually effective. It is
# kept here only so adding such a rule later needs no config edit, and it is
# never invoked as things stand.
reviewer:
  tiers:
    standard:
      provider: claude-code
      consensus: 1
      config:
        model: haiku
