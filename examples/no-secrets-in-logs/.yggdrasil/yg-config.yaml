version: "6.0.0"

quality:
  max_direct_relations: 10

# Enforcement targets the source tree. Only files under src/ must be mapped to
# a node; the README and graph metadata are not graph-covered code. The
# Yggdrasil-managed agent-rules files and the gitattributes scaffold are repo
# plumbing, not example source, so they are excluded rather than mapped.
coverage:
  required: ["src"]
  excluded: ["README.md", "AGENTS.md", "CLAUDE.md", ".clinerules/", ".gitattributes"]

# This example is KEYLESS: its only rules are script rules, and a script-only
# project needs no reviewer: section at all. Add one (yg init --provider ...)
# when you add the first reviewer rule.
