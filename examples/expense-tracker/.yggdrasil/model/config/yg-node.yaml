name: Configuration
type: library
description: "Build and project configuration files"
blackbox: true

mapping:
  - paths:
      - .gitignore
      - CLAUDE.md
      - README.md
      - package.json
      - package-lock.json
      - apps/api/package.json
      - apps/api/tsconfig.json
      - apps/web/package.json
      - apps/web/tsconfig.json
      - apps/web/index.html
      - apps/web/vite.config.ts
      - packages/shared/package.json
      - scripts/check.sh
