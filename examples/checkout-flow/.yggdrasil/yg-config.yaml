version: "5.2.0"

quality:
  max_direct_relations: 10

# Enforcement targets the source tree. Only files under src/ must be mapped to a
# node; the README and graph metadata are not graph-covered code. The
# Yggdrasil-managed agent-rules files and the gitattributes scaffold are repo
# plumbing, not example source, so they are excluded rather than mapped.
coverage:
  required: ["src"]
  excluded: ["README.md", "AGENTS.md", "CLAUDE.md", ".clinerules/", ".gitattributes"]

# This example is KEYLESS: its only aspect is deterministic (check.mjs), which
# runs locally at zero cost. The reviewer tier below is required boilerplate so
# the project could add LLM aspects later; no LLM call is made by this example.
reviewer:
  tiers:
    standard:
      provider: claude-code
      consensus: 1
      config:
        model: haiku
