version: "5.2.0"

quality:
  max_direct_relations: 10

# The graph covers the source tree; every file under src/ must be mapped to a
# node (an unmapped src file is a blocking error). The example's own README is
# documentation, not source under enforcement, so it is excluded from the scan.
# The Yggdrasil-managed agent-rules files and the gitattributes scaffold are repo
# plumbing, not example source, so they are excluded too rather than mapped.
coverage:
  required:
    - src
  excluded:
    - README.md
    - AGENTS.md
    - CLAUDE.md
    - .clinerules/
    - .gitattributes

reviewer:
  tiers:
    standard:
      provider: claude-code
      consensus: 1
      config:
        model: haiku
