# Court digest — dogfood-only cadence anchor (RZ-6).
#
# A weekly, read-only, keyless job: it builds the CLI and runs `yg advise --all`,
# then upserts a single PINNED issue titled "Court digest" with the output. This
# is the maintainer's one-place weekly review of the attention/nomination feed.
#
# NOT an adopter default: `yg init` never scaffolds this, and it is never surfaced
# via `suggestedNext`. Adopters treat it as a documented pattern to copy, not a
# shipped file. The job calls no reviewer, needs no provider key, and never writes
# the lock or runs `--approve` — `yg advise` is read-only and exits 0 on any
# loadable graph. Permissions are narrowed to exactly what the upsert needs.
name: Court digest

on:
  schedule:
    # Weekly, Mondays 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build the CLI
        working-directory: source/cli
        run: |
          npm ci
          npm run build
      - name: Render and publish the Court digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Read-only, keyless: the digest body is the advise feed (all items, uncapped).
          node source/cli/dist/bin.js advise --all > digest.txt
          BODY=$(printf '_Generated by the weekly Court digest job (read-only, keyless)._\n\n```text\n%s\n```\n' "$(cat digest.txt)")
          TITLE='Court digest'
          # Find the existing open digest issue by exact title (find-or-create-then-update).
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "$TITLE" --body "$BODY" | grep -oE '[0-9]+$')
            # Pin it so it stays the canonical one-place digest (idempotent; ignore if already pinned).
            ISSUE_ID=$(gh issue view "$NUM" --json id --jq .id)
            gh api graphql -f query='mutation($id:ID!){ pinIssue(input:{issueId:$id}){ issue { number } } }' \
              -f id="$ISSUE_ID" || echo "pin skipped (already pinned or pin limit reached)"
          else
            gh issue edit "$NUM" --body "$BODY"
          fi
