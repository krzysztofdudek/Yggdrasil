name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Tag Release']
    types: [completed]
    branches: [main]

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' source/cli/package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          # dist-tag: a prerelease (X.Y.Z-<id>.N) publishes under its <id>
          # (alpha/beta/rc); a stable X.Y.Z publishes under 'latest'.
          if [[ "${VERSION}" == *-* ]]; then
            PRE="${VERSION#*-}"
            echo "disttag=${PRE%%.*}" >> $GITHUB_OUTPUT
          else
            echo "disttag=latest" >> $GITHUB_OUTPUT
          fi
      - name: Check npm for existing version
        id: npm-check
        # Pass the step output through the environment rather than interpolating
        # ${{ ... }} straight into the shell, so the value can never be parsed as
        # shell syntax (injection-safe handling of a workflow-computed value).
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@chrisdudek/yg@${VERSION}" version > /dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "::notice::Version ${VERSION} already published on npm. Skipping publish + GitHub release."
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
      # The release page's story comes from CHANGELOG.md, not from the commit
      # list. `generate_release_notes` alone produces only the merged-PR listing,
      # which says what landed but never what the release is FOR — while this
      # repository already writes its changelog to release-notes standard and had
      # no way to get it in front of a reader. Extracted here rather than
      # hand-pasted at tag time so the published notes cannot drift from the file
      # the repository reviews.
      #
      # It runs BEFORE the publish, and that placement is load-bearing: the step
      # fails the run when the changelog carries no section for this version, and
      # `npm publish` cannot be taken back. A version published without its
      # release page could not get one from a re-run either — the npm-existence
      # check above skips every remaining step, this one and the release itself
      # included, once the version is on the registry.
      - name: Build release notes from CHANGELOG
        if: steps.npm-check.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v want="## [${VERSION}]" '
            /^## \[/ { if (found) exit; found = (index($0, want) == 1); next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "${RUNNER_TEMP}/release-notes.md"
          # Fail closed. An empty body would publish a release whose notes are the
          # bare commit list — indistinguishable from this step not existing, and
          # discovered only by whoever reads the release afterwards.
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "::error::CHANGELOG.md carries no section for ${VERSION} — add '## [${VERSION}] - <date>' before releasing."
            exit 1
          fi
          # The artifact this release is asking people to move to. A release
          # note that describes a change without naming the thing you install to
          # get it leaves the reader to go and find it. Written with printf
          # rather than a heredoc: a heredoc body would have to sit at column 0
          # and would end this YAML block scalar early.
          {
            printf '\n## Update\n\n'
            printf '```\n'
            printf 'npm i -g @chrisdudek/yg@%s\n' "${VERSION}"
            printf '```\n\n'
            printf 'Package: https://www.npmjs.com/package/@chrisdudek/yg/v/%s\n' "${VERSION}"
          } >> "${RUNNER_TEMP}/release-notes.md"
      - uses: actions/setup-node@v7
        if: steps.npm-check.outputs.published == 'false'
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Use OIDC-capable npm
        if: steps.npm-check.outputs.published == 'false'
        run: npm install -g npm@latest
      - run: npm ci
        if: steps.npm-check.outputs.published == 'false'
        working-directory: source/cli
      - run: npm run build
        if: steps.npm-check.outputs.published == 'false'
        working-directory: source/cli
      # No NODE_AUTH_TOKEN: authentication is via OIDC trusted publishing
      # (permissions.id-token: write above). Provenance is generated automatically.
      - name: Publish to npm
        if: steps.npm-check.outputs.published == 'false'
        working-directory: source/cli
        # Pass the dist-tag through the environment, not a raw ${{ ... }} shell
        # interpolation, so a computed value can never be parsed as shell syntax.
        env:
          DISTTAG: ${{ steps.version.outputs.disttag }}
        run: npm publish --provenance --access public --tag "${DISTTAG}"
      - uses: softprops/action-gh-release@v3
        if: steps.npm-check.outputs.published == 'false'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # The changelog section leads; the generated commit list is appended
          # beneath it as reference material.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          # Flag prerelease versions (X.Y.Z-<id>) so they don't show as Latest.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
