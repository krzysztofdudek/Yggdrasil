version: 2
updates:
  - package-ecosystem: npm
    directory: /source/cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Grouped so routine upgrades arrive as one reviewable change — but a MAJOR
    # is deliberately left out of both groups and opened on its own. Grouped with
    # patches, a single breaking upgrade holds every harmless one hostage behind
    # a red build until somebody finds time for the migration; on its own it can
    # wait for that time without blocking anything.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docs

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
