<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yggdrasil — Getting Started Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;overflow:hidden;width:100vw;height:100vh;font-family:'JetBrains Mono',monospace}

#start{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#050508;transition:opacity .4s}
#start.gone{opacity:0;pointer-events:none}
#start span{font:13px 'Inter',sans-serif;color:#444;letter-spacing:4px;text-transform:uppercase;animation:p 2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.3}50%{opacity:.9}}

#screen{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:center;padding:24px;opacity:0;transition:opacity .4s}
#screen.on{opacity:1}
#term-wrap{width:100%;max-width:920px;max-height:520px;background:#0d1117;border:1px solid #1a1e26;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 20px 80px rgba(0,0,0,.6)}
#term-head{padding:12px 16px;display:flex;gap:7px;align-items:center;border-bottom:1px solid #151920}
#term-head .dot{width:10px;height:10px;border-radius:50%}
#term-head .dot:nth-child(1){background:#ff5f57}
#term-head .dot:nth-child(2){background:#febc2e}
#term-head .dot:nth-child(3){background:#28c840}
#term-head .title{flex:1;text-align:center;font-size:11px;color:#8b949e;letter-spacing:2px}
#term-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 20px;scroll-behavior:auto}
#term-body::-webkit-scrollbar{width:0}

.ln{font-size:clamp(11px,1.2vw,14px);line-height:1.7;white-space:pre-wrap;word-break:break-all;min-height:1em;opacity:0;animation:fadeIn .15s ease forwards;color:#c9d1d9}
@keyframes fadeIn{to{opacity:1}}

.ln .pr{color:#7ee787}
.ln .bl{color:#58a6ff}
.ln .ye{color:#d29922}
.ln .wh{color:#e6e6e6}
.ln .cy{color:#79c0ff}
.ln .pp{color:#bc8cff}
.ln .dim{color:#768390}
.ln .red{color:#f85149}
.ln .green{color:#7ee787}
.ln .bold{font-weight:700}

.ln.cmd{color:#e6e6e6}
.ln.output{color:#adbac7}
.ln.success{color:#7ee787}
.ln.error{color:#f85149}
.ln.dim{color:#768390;font-style:italic}
.ln.agent{color:#bc8cff;font-style:italic}
.ln.heading{color:#58a6ff;font-weight:700;border-bottom:1px solid rgba(88,166,255,.15);padding-bottom:4px;margin-top:8px}
.ln.separator{border-top:1px solid #1a1e26;margin:8px 0;min-height:0;height:1px}

#big{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;padding:20px}
#big.on{opacity:1}
#big .line{font-family:'Inter',sans-serif;font-size:clamp(18px,3.5vw,48px);font-weight:700;color:#fff;line-height:1.5}
#big .line.sub{font-size:clamp(13px,2vw,24px);font-weight:400;color:#888}
#big .line .g{color:#7ee787}
#big .line .r{color:#f85149}
#big .line .b{color:#58a6ff}

#bar{position:fixed;bottom:0;left:0;height:2px;background:linear-gradient(90deg,#7ee787,#58a6ff);width:0;z-index:60}
</style>
</head>
<body>
<div id="start"><span>click to start</span></div>
<div id="screen">
  <div id="term-wrap">
    <div id="term-head">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="title" id="term-title">terminal</div>
    </div>
    <div id="term-body"></div>
  </div>
</div>
<div id="big"></div>
<div id="bar"></div>

<script>
const body=document.getElementById('term-body');
const termTitle=document.getElementById('term-title');
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function addLine(html,cls=''){
  const el=document.createElement('div');
  el.className='ln'+(cls?' '+cls:'');
  el.innerHTML=html;
  body.appendChild(el);
  body.scrollTop=body.scrollHeight;
  return el;
}

function clearTerm(){body.innerHTML=''}

function showScreen(){document.getElementById('screen').classList.add('on')}
function hideScreen(){document.getElementById('screen').classList.remove('on')}

function showBig(html){
  const b=document.getElementById('big');
  b.innerHTML=html;
  b.classList.add('on');
}
function hideBig(){document.getElementById('big').classList.remove('on')}

// typing effect for commands
async function typeCmd(text, prefix='<span class="pr">$</span> '){
  const el=addLine(prefix,'cmd');
  let buf=prefix;
  for(const ch of text){
    buf+=ch;
    el.innerHTML=buf+'<span class="dim">_</span>';
    await wait(25+Math.random()*35);
  }
  el.innerHTML=buf;
  return el;
}

// ===== TIMELINE =====
// Mirrors tools/render-demo-gif.js. The claim is persistence across sessions:
// session 1 shows the loop, session 2 shows that nobody restates anything.
// Keep the two in sync when either changes.
async function run(){
  const bar=document.getElementById('bar');
  const DUR=20000,t0=performance.now();
  (function tick(){bar.style.width=Math.min(100,((performance.now()-t0)/DUR)*100)+'%';if(performance.now()-t0<DUR)requestAnimationFrame(tick)})();

  // ========== SESSION 1: the task ==========
  termTitle.textContent='claude code';
  showScreen();
  await wait(500);

  addLine('<span class="bl bold">You:</span> <span class="bl">Add a charge endpoint. Payments must emit an</span>','');
  addLine('     <span class="bl">audit event and record to the ledger.</span>','');
  await wait(1600);

  // ---- the rules reach the agent BEFORE it writes ----
  addLine('','');
  addLine('<span class="pp bold">Agent:</span> Pulling the rules that touch this file first.','agent');
  await wait(700);

  addLine('','');
  await typeCmd('yg context --file src/payments/charge.ts','<span class="pp">▶</span> ');
  await wait(300);
  addLine('  <span class="dim">node: payments/service</span>','');
  addLine('  <span class="output">requires-audit    </span><span class="cy">[llm]</span><span class="output">  read: aspects/requires-audit/content.md</span>','');
  addLine('  <span class="output">input-validation  </span><span class="cy">[llm]</span><span class="output">  read: aspects/input-validation/content.md</span>','');
  addLine('  <span class="output">no-direct-db      </span><span class="green">[det]</span><span class="output">  read: aspects/no-direct-db/check.mjs</span>','');
  await wait(1600);

  addLine('','');
  addLine('  <span class="dim">src/payments/charge.ts</span>  <span class="green">created</span>','');
  await wait(900);

  // ---- the check catches what a rules file would have let through ----
  addLine('','');
  await typeCmd('yg check --approve','<span class="pp">▶</span> ');
  await wait(400);
  addLine('  <span class="green">[det]</span> no-direct-db    <span class="green">approved</span>  <span class="dim">(no cost)</span>','success');
  await wait(300);
  addLine('  <span class="red">[llm]</span> requires-audit  <span class="red bold">refused</span>','error');
  addLine('    <span class="output">charge() mutates state but never calls emitAudit().</span>','');
  await wait(1800);

  addLine('','');
  addLine('<span class="pp bold">Agent:</span> Missing the audit event. Adding it.','agent');
  await wait(700);
  addLine('  <span class="dim">src/payments/charge.ts</span>  <span class="ye">modified</span>','');
  await wait(500);
  addLine('  <span class="green bold">yg check: PASS</span>  <span class="output">1 nodes · 2/2 files · 3 aspects · 0 flows</span>','success');
  await wait(1600);

  // ========== THE SESSION BOUNDARY ==========
  hideScreen();
  await wait(700);
  showBig('<div class="line">Next week. New session.</div><div class="line sub" style="margin-top:12px">Nobody restates the rules.</div>');
  await wait(2400);
  hideBig();
  await wait(500);

  // ========== SESSION 2: it holds, first try, no key ==========
  clearTerm();
  showScreen();
  await wait(400);

  addLine('<span class="bl bold">You:</span> <span class="bl">Add a refund endpoint.</span>','');
  await wait(1300);

  addLine('','');
  addLine('<span class="pp bold">Agent:</span> Same three rules apply here. Writing to them.','agent');
  await wait(900);
  addLine('  <span class="dim">src/payments/refund.ts</span>  <span class="green">created</span>','');
  await wait(900);

  addLine('','');
  await typeCmd('yg check   <span class="dim"># the gate — no LLM, no keys</span>','<span class="pp">▶</span> ');
  await wait(400);
  addLine('  <span class="green bold">yg check: PASS</span>  <span class="output">1 nodes · 3/3 files · 3 aspects · 0 flows</span>','success');
  await wait(2000);

  // ========== PUNCHLINE ==========
  hideScreen();
  await wait(700);
  showBig('<div class="line" style="font-size:clamp(26px,5vw,58px);font-weight:900">Say it once.</div><div class="line sub" style="margin-top:16px">The rule you wrote last week is still enforced today.</div><div class="line sub" style="margin-top:24px;font-family:JetBrains Mono,monospace;font-size:clamp(12px,1.3vw,16px);color:#7ee787">npm install -g @chrisdudek/yg</div>');
  await wait(5000);
}

document.getElementById('start').addEventListener('click',()=>{
  document.getElementById('start').classList.add('gone');
  setTimeout(run,400);
});
</script>
</body>
</html>
