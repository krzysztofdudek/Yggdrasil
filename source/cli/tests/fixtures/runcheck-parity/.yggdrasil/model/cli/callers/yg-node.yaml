name: Callers
type: engine
description: >-
  Every runCheck call-site shape the parity rule must judge, in one node so a
  single run yields the complete violation set: five that provably omit an
  issue-affecting option — three an issue-gating one, one the whole-list
  rewrite, one the member declared ahead of its consumer — (must be refused)
  and four that cannot be proven to omit one (must stay silent).
aspects:
  - runcheck-injected-input-parity
relations:
  - target: cli/core/check
    type: calls
mapping:
  - src/callers/
