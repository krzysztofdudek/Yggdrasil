name: OrderService
description: x
type: service
aspects:
  - "requires-audit"
relations:
  - target: auth/auth-api
    type: uses
    consumes:
      - authenticate
    failure: reject-request
  - target: users/user-repo
    type: uses
  - target: users/user-repo
    type: emits
    event_name: order.created
mapping:
  - paths:
      - src/orders/order.service.ts
    aspects:
      - aspect: requires-audit
        anchors:
          proof-point:
            regex: 'AuditLog\.|audit\('
            rationale: 'All order operations are logged to audit trail'
      - aspect: requires-logging
        anchors:
          proof-point:
            regex: 'logger\.'
            rationale: 'Service logs all operations'
