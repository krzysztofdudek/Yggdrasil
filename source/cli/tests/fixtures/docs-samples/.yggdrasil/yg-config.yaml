version: "6.0.0"

# The project the docs' terminal samples are recorded in (tests/support/docs-samples.ts).
# The reviewer is never called: no sample runs a fill.
reviewer:
  default: standard
  tiers:
    standard:
      provider: ollama
      consensus: 3
      config:
        model: "qwen2.5-coder:0.5b"
        endpoint: "http://127.0.0.1:11434"

coverage:
  required:
    - src
  type_level: true
