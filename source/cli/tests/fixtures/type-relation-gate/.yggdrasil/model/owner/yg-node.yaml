name: Owner
type: owner-type
description: "The one explicit node in this fixture — an edge target whose type (owner-type) never classifies any OTHER file, so every edge into this node is an explicit-node endpoint, never a type-covered one. Carries a port with no consumer (K4) — every edge into it from the type-covered svc/util universe is DERIVED (static import resolution), never a declared node relation, so it can never reach port-contract machinery, which only ever reads a node's own declared relations."
mapping:
  - src/owner/target.ts
ports:
  api:
    description: Present only to prove a derived (non-declared) edge into this node never trips port-missing-consumes or delivers a port aspect to the type-covered source file — no relation in this fixture ever declares consumes against it.
    aspects: []
