name: Callers
type: engine
description: >-
  A single runCheck call site passing every DERIVED option and not the
  hand-signed one, which demands nothing while its entry stands unproven. It is
  the second half of each requirement's proof: drop a matcher requirement and
  this call site is refused for the omission the moment the seam's read starts
  deriving.
aspects:
  - runcheck-injected-input-parity
relations:
  - target: cli/core/check
    type: calls
mapping:
  - src/callers/
